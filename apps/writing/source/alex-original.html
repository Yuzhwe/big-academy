/* ===== v4 · lesson book (two-level navigation) around the Clicker-style editor ===== */
:root {
  --school: 'Andika', 'Lexend', 'Century Gothic', 'Segoe UI', sans-serif;
  --ui: 'Segoe UI', 'Lexend', system-ui, -apple-system, sans-serif;
  --navy: #1c2c5b; --navy-2: #2b417c; --sky: #c9dfee; --sky-2: #e7f2f9; --sky-3: #f3f8fc;
  --frame: #1c2c5b; --frame-dark: #142146; --ink: #1f2a37; --soft: #5b6878; --line: #d5e0ea;
  --doc-size: 25px; --fit: 1; --margin-w: 290px; --dot: 44px; --rail-w: 72px; --paper: #fff;
  --hl-yellow: #fff1b8; --hl-green: #d8f0d9; --hl-blue: #e3eefb; --hl-red: #fde0dc;
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body { background: #fff; font-family: var(--ui); color: var(--ink); overflow: hidden; -webkit-text-size-adjust: 100%; }
button { font: inherit; color: inherit; cursor: pointer; }
button:disabled { cursor: default; opacity: .45; }
.ico { display: inline-flex; line-height: 0; }
:focus-visible { outline: 3px solid #4d8fd6; outline-offset: 2px; }

/* ---------- app frame: top bar · stage (rail | sheet | rail) · grid · bottom bar ---------- */
.app { position: fixed; inset: 0; height: 100vh; height: 100dvh; display: flex; flex-direction: column; background: #fff; overflow: hidden; }
.topbar { flex: none; height: 52px; display: flex; align-items: center; gap: 14px; padding: 0 14px 0 12px; background: #fff; border-bottom: 1px solid var(--line); box-shadow: inset 0 4px 0 var(--sky); }
.tb-menu { flex: none; width: 38px; height: 38px; border-radius: 50%; border: 0; background: var(--navy); color: #fff; display: inline-flex; align-items: center; justify-content: center; margin-top: 3px; }
.tb-menu:hover { background: var(--navy-2); }
.tb-title { flex: 1; min-width: 0; display: flex; align-items: baseline; gap: 10px; margin-top: 3px; }
.tb-step { font-size: 16px; color: var(--navy); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.tb-zh { font-size: 13px; color: #6b7684; }
.tb-right { display: flex; align-items: center; gap: 12px; margin-top: 3px; }
.tb-count { font-size: 14px; color: #5b6878; white-space: nowrap; }
.tb-btn { border: 1px solid var(--line); background: #fff; color: var(--navy); border-radius: 18px; padding: 4px 14px; font-size: 14px; }
.tb-btn.on { background: var(--sky-2); }
.stage { flex: 1; min-height: 0; display: grid; grid-template-columns: var(--rail-w) minmax(0, 1fr); background: #fff; }
.rail { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px; padding: 8px 0; min-height: 0; overflow: hidden; }
.pdot { position: relative; flex: none; width: var(--dot); height: var(--dot); border-radius: 50%; border: 2px solid var(--navy); background: #fff; color: var(--navy); font-size: calc(var(--dot) * .4); font-family: var(--ui); display: inline-flex; align-items: center; justify-content: center; padding: 0; transition: background .15s; }
.pdot:hover { background: var(--sky-3); }
.pdot.done { background: var(--sky-2); border-color: #5b7fb0; }
.pdot.on { background: var(--navy); color: #fff; border-color: var(--navy); box-shadow: 0 0 0 4px var(--sky); }
.pdot.locked { border-color: #c3ccd8; color: #6b7684; background: #fff; cursor: not-allowed; }
.pd-tick { position: absolute; right: -4px; top: -4px; width: 17px; height: 17px; border-radius: 50%; background: #3f8a52; color: #fff; display: flex; align-items: center; justify-content: center; }
.pdot.sm { --dot: 34px; }

/* ---------- the sheet: one framed editor page per activity ---------- */
.sheet { min-width: 0; min-height: 0; display: flex; flex-direction: column; margin: 10px 0 8px; background: var(--sky-3); border: 1px solid var(--line); border-radius: 14px; overflow: hidden; box-shadow: 0 1px 2px rgba(28, 44, 91, .06); }
.sheet-head { flex: none; display: flex; align-items: center; gap: 12px; padding: 6px 10px 6px 16px; background: var(--sky); min-height: 50px; }
.sh-title { flex: 1; min-width: 0; display: flex; align-items: center; gap: 10px; }
.sh-n { flex: none; width: 30px; height: 30px; border-radius: 50%; background: var(--navy); color: #fff; font-size: 14px; display: inline-flex; align-items: center; justify-content: center; }
.sh-h { margin: 0; font-size: 19px; font-weight: 700; color: var(--navy); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-family: var(--ui); }
.sh-zh { font-size: 14px; color: #4f5f73; white-space: nowrap; }
.ribbon { display: flex; gap: 2px; align-items: center; }
.rb { border: 0; background: transparent; min-width: 54px; padding: 3px 4px 2px; border-radius: 9px; display: flex; flex-direction: column; align-items: center; gap: 1px; color: var(--navy); }
.rb:hover { background: rgba(255, 255, 255, .6); }
.rb.pressed { background: #fff; box-shadow: inset 0 0 0 1px #9fbcd8; }
.rb.na { opacity: .45; }
.rb-l { font-size: 11.5px; color: #33445c; white-space: nowrap; }
.docScroll { flex: 1; min-height: 0; overflow-y: auto; overflow-x: hidden; background: var(--paper); scroll-behavior: auto; }
.sheet-foot { flex: none; display: flex; align-items: center; gap: 12px; padding: 7px 10px; border-top: 1px solid var(--line); background: #fff; min-height: 56px; }
.foot-mid { flex: 1; min-width: 0; display: flex; align-items: center; justify-content: center; gap: 14px; font-size: 14px; color: #5b6878; }
#statusMsg { opacity: 0; transition: opacity .25s; color: var(--navy-2); text-align: center; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
#statusMsg.on { opacity: 1; }
#statusWords { white-space: nowrap; color: #5b6878; }
.nav-b { border: 2px solid #c3ccd8; background: #fff; color: #5b6878; border-radius: 24px; padding: 6px 16px 6px 12px; font-size: 17px; display: inline-flex; align-items: center; gap: 6px; font-family: var(--ui); min-height: 42px; }
.nav-b.back { color: var(--navy); border-color: #c3d2e2; }
.nav-b.next { padding: 6px 12px 6px 18px; }
.nav-b.next.on { background: var(--navy); border-color: var(--navy); color: #fff; }
.nav-b.next.on:hover { background: var(--navy-2); }
.nav-b.next.act { padding: 6px 20px; background: #2f6b3d; border-color: #2f6b3d; }
.nav-b.next.act:hover { background: #285c34; }
.nav-b[aria-disabled=true] { cursor: default; }
@keyframes nudge { 0%, 100% { transform: translateX(0); } 30% { transform: translateX(-5px); } 60% { transform: translateX(5px); } }
.nav-b.nudge { animation: nudge .35s; }

/* ---------- bottom bar + Menu tab (publisher footer) ---------- */
.bottombar { flex: none; position: relative; height: 38px; display: flex; align-items: center; justify-content: space-between; padding: 0 16px; background: var(--sky-2); border-top: 1px solid var(--line); }
.brand { font-size: 12.5px; color: #4f5f73; white-space: nowrap; }
.page-dots { display: none; gap: 6px; align-items: center; }
.menu-tab { position: absolute; left: 50%; bottom: 0; transform: translateX(-50%); height: 40px; padding: 0 22px; border: 0; border-radius: 12px 12px 0 0; background: var(--navy); color: #fff; font-size: 16px; display: inline-flex; align-items: center; gap: 8px; }
.menu-tab:hover { background: var(--navy-2); }

/* ---------- overlays ---------- */
.scrim { position: absolute; inset: 0; background: rgba(20, 30, 60, .28); opacity: 0; pointer-events: none; transition: opacity .2s; z-index: 20; }
.scrim.on { opacity: 1; pointer-events: auto; }
.drawer { position: absolute; left: 0; right: 0; bottom: 0; z-index: 30; background: var(--navy); color: #fff; padding: 22px 20px 14px; transform: translateY(calc(100% + 48px)); visibility: hidden; transition: transform .25s ease, visibility 0s linear .25s; box-shadow: 0 -6px 24px rgba(10, 20, 50, .25); }
.drawer.on { transform: none; visibility: visible; transition: transform .25s ease; }
.dr-tab { position: absolute; left: 50%; top: -40px; transform: translateX(-50%); }
.dr-tabb { height: 40px; padding: 0 22px; border: 0; border-radius: 12px 12px 0 0; background: var(--navy); color: #fff; font-size: 16px; display: inline-flex; align-items: center; gap: 8px; }
.tiles { display: flex; flex-wrap: wrap; justify-content: center; gap: 14px; max-width: 1180px; margin: 0 auto; }
.tile { width: 132px; border: 0; padding: 0; border-radius: 14px; background: #fff; color: var(--ink); overflow: hidden; display: flex; flex-direction: column; box-shadow: 0 2px 0 rgba(0, 0, 0, .25); }
.tile:hover { transform: translateY(-1px); }
.tile-art { position: relative; height: 72px; background: #e9ecf0; display: flex; align-items: center; justify-content: center; color: var(--navy); }
.tile-l { padding: 9px 6px 10px; font-size: 14px; text-align: center; line-height: 1.2; min-height: 2.6em; display: flex; align-items: center; justify-content: center; }
.tile[aria-pressed=true] .tile-art, .tile.on .tile-art { background: var(--sky); }
.tile.off { background: #c3cad4; opacity: 1; }
.tile.off .tile-art { background: #b4bcc8; color: #4d5868; }
.tile.off .tile-l { color: #3d4757; }
.tile-badge { position: absolute; right: 38px; top: 14px; width: 12px; height: 12px; border-radius: 50%; background: #d43a3a; }
.art-sum { display: flex; flex-direction: column; gap: 5px; }
.art-sum > span { display: flex; align-items: center; gap: 6px; }
.art-sum i { width: 11px; height: 11px; border-radius: 50%; display: block; }
.art-sum b { height: 9px; background: #a9b4d6; display: block; }
.art-ix { display: flex; }
.art-ix i { width: 34px; height: 34px; border-radius: 50%; border: 2px solid #c9cfda; background: #fff; display: inline-flex; align-items: center; justify-content: center; font-style: normal; font-size: 17px; margin: 0 -3px; }
.art-ix i.mid { background: #6f73b5; color: #fff; border-color: #6f73b5; position: relative; z-index: 1; }
.art-ov { position: relative; width: 50px; height: 46px; }
.art-ov i { position: absolute; width: 28px; height: 28px; border-radius: 50%; border: 2px solid var(--navy); mix-blend-mode: multiply; }
.art-ov i:nth-child(1) { left: 11px; top: 0; } .art-ov i:nth-child(2) { left: 0; top: 16px; } .art-ov i:nth-child(3) { left: 22px; top: 16px; }
.art-zh { font-family: 'Noto Sans CJK SC', 'PingFang SC', 'Microsoft YaHei', sans-serif; font-size: 26px; font-weight: 700; }
.art-size { font-family: var(--school); font-size: 38px; font-weight: 700; } .art-size small { font-size: 22px; margin-right: 2px; }
.swatches { display: flex; justify-content: center; gap: 10px; margin: 14px auto 0; flex-wrap: wrap; }
.sw { border: 2px solid transparent; background: rgba(255, 255, 255, .1); color: #fff; border-radius: 22px; padding: 4px 14px 4px 5px; display: inline-flex; align-items: center; gap: 8px; font-size: 14px; }
.sw i { width: 26px; height: 26px; border-radius: 50%; border: 1px solid rgba(0, 0, 0, .2); }
.sw.on { border-color: #fff; background: rgba(255, 255, 255, .2); }
.dr-foot { display: flex; justify-content: center; align-items: center; gap: 18px; margin-top: 14px; position: relative; }
.dr-close { border: 2px solid #fff; background: #fff; color: var(--navy); border-radius: 20px; padding: 3px 22px; font-size: 16px; }
.dr-link { position: absolute; left: 0; border: 0; background: transparent; color: #cfdcf0; font-size: 14px; display: inline-flex; align-items: center; gap: 6px; }
.panel { position: absolute; z-index: 25; top: 60px; left: calc(var(--rail-w) + 4px); width: min(680px, calc(100% - var(--rail-w) - 24px)); max-height: calc(100% - 120px); display: none; flex-direction: column; background: #fff; border-radius: 16px; box-shadow: 0 10px 40px rgba(10, 20, 50, .28); overflow: hidden; }
.panel.on { display: flex; }
.ix-head { flex: none; display: flex; align-items: center; justify-content: space-between; padding: 10px 12px 10px 20px; background: var(--sky); color: var(--navy); font-weight: 700; font-size: 17px; }
.ix-close { border: 0; background: transparent; color: var(--navy); width: 34px; height: 34px; border-radius: 50%; display: inline-flex; align-items: center; justify-content: center; }
.ix-close:hover { background: rgba(255, 255, 255, .6); }
.ix-scroll { overflow-y: auto; min-height: 0; }
table.ix { width: 100%; border-collapse: collapse; font-size: 15.5px; color: var(--navy); }
table.ix th { position: sticky; top: 0; background: #dbe8f2; font-weight: 700; padding: 9px 10px; text-align: left; font-size: 15px; }
table.ix td { padding: 0 10px; border-bottom: 1px solid #d4e0ec; height: 44px; }
table.ix td.ix-n { width: 48px; text-align: center; border-right: 1px solid #d4e0ec; color: #34466f; }
table.ix td.ix-p { width: 56px; text-align: center; color: #5b6f90; font-size: 14px; }
table.ix td.ix-c { width: 44px; text-align: center; }
tr.ix-step { background: #eaf4fa; }
tr.ix-step:nth-of-type(even) { background: #fff; }
tr.ix-step.cur td.ix-t b { text-decoration: underline; text-decoration-thickness: 2px; text-underline-offset: 4px; }
tr.ix-step.complete td.ix-p { color: #3f8a52; }
tr.ix-step.locked { color: #5b6878; }
.ix-tog { border: 0; background: transparent; padding: 0; text-align: left; color: inherit; font-size: inherit; }
.ix-tog b { font-weight: 600; }
.ix-chev { border: 0; background: transparent; color: var(--navy); padding: 4px; display: inline-flex; transition: transform .15s; }
.ix-chev.open { transform: rotate(180deg); }
tr.ix-page { background: #fff; cursor: pointer; font-size: 15px; }
tr.ix-page td { height: 40px; }
tr.ix-page:hover { background: var(--sky-3); }
tr.ix-page td.ix-t { padding-left: 18px; }
.ix-dot { display: inline-flex; width: 26px; height: 26px; border-radius: 50%; border: 1.5px solid var(--navy); align-items: center; justify-content: center; font-size: 13px; margin-right: 10px; }
tr.ix-page.done .ix-dot { background: var(--sky-2); }
tr.ix-page.on .ix-dot { background: var(--navy); color: #fff; }
tr.ix-page.done td.ix-p { color: #3f8a52; }
tr.ix-page.locked { color: #6b7684; cursor: not-allowed; }
tr.ix-page.locked .ix-dot { border-color: #c3ccd8; }
.sum-body { padding: 14px 20px 18px; overflow-y: auto; font-size: 15.5px; color: var(--navy); }
.sum-line { margin: 6px 0 10px; }
.sum-bars { display: flex; flex-direction: column; gap: 6px; margin: 4px 0 12px; }
.sum-row { display: grid; grid-template-columns: minmax(0, 1fr) 160px 44px; align-items: center; gap: 12px; font-size: 14.5px; }
.sum-bar { height: 10px; border-radius: 6px; background: #e3ebf3; overflow: hidden; }
.sum-bar i { display: block; height: 100%; background: #4a6fa5; }
.sum-n { color: #5b6878; text-align: right; }
.sum-chk { display: inline-block; margin: 0 10px 4px 0; padding: 2px 10px; border-radius: 12px; background: #eef2f6; font-size: 14px; }
.sum-chk.ok { background: #dcefdf; color: #2f6b3d; }

/* colour overlays for reading comfort (tint the page, not the controls) */
.app[data-overlay=cream] { --paper: #fbf1d6; }
.app[data-overlay=blue] { --paper: #dcecfb; }
.app[data-overlay=yellow] { --paper: #fbf6b8; }
.app[data-overlay=green] { --paper: #dff1da; }
.app[data-overlay=rose] { --paper: #f9e1e6; }
.app:not([data-overlay=none]) .paper, .app:not([data-overlay=none]) .margin { background: transparent; }
.app:not([data-overlay=none]) .rg.inline-edit { background: rgba(255, 255, 255, .55); }

/* ---------- the page of paper ---------- */
.paper { position: relative; display: grid; grid-template-columns: minmax(0, 1fr) var(--margin-w); min-height: 100%; background: var(--paper); }
.doc { padding: 26px 40px 30px 26px; font-family: var(--school); font-size: calc(var(--doc-size) * var(--fit)); line-height: 1.7; min-width: 0; }
.margin { position: relative; border-left: 1px solid #e3eaf1; background: #f8fafc; }
.paper.no-margin { grid-template-columns: minmax(0, 1fr) 0; }
.paper.no-margin .margin { display: none; }
.paper.no-margin .doc { max-width: 1100px; }
.ptitle { font-size: 1.4em; line-height: 1.25; margin: 0 0 .2em 44px; color: #1d3557; font-weight: 700; }
.zh-title { font-size: .55em; color: #5b6878; font-weight: 400; margin-left: .6em; }
.teach { margin: 0 0 1em 44px; color: #35506e; }
.zh { font-family: 'Noto Sans CJK SC', 'PingFang SC', 'Microsoft YaHei', sans-serif; font-size: .72em; line-height: 1.5; color: #6b7684; margin: -.2em 0 .5em 0; }
.teach + .zh, .ptitle + .zh { margin-left: 44px; }
.zh-inline { font-family: 'Noto Sans CJK SC', 'PingFang SC', sans-serif; font-size: .7em; color: #6b7684; }
.quiet { color: #5b6878; font-size: .82em; }
.small { font-size: .7em; }
.say-inline { border: 0; background: transparent; color: #7d95b3; padding: 0 4px; vertical-align: middle; border-radius: 6px; }
.say-inline:hover { color: var(--frame); background: #eef3f9; }
.example { margin: 0 0 1.2em 44px; padding: 0; }
.example p { margin: 0; }
.ex-l { font-size: .78em; color: #5b6878; display: inline-block; min-width: 4.6em; }
.ex-l.yes { color: #2f7a3b; }

/* ---------- tasks inside the document ---------- */
.task { display: grid; grid-template-columns: 44px minmax(0, 1fr); margin: 0 0 1.3em; }
.gutter { padding-top: .25em; color: #5b6878; font-size: .8em; }
.task.current .gutter .num { color: var(--frame); font-weight: 700; }
.tick { display: inline-flex; color: #3f9a4a; }
.tick.shown { color: #5b6878; }
.ask { margin: 0 0 .25em; font-weight: 600; color: #22344a; }
.ask.big { margin-left: 44px; }
.task.done .ask { font-weight: 400; color: #5b6878; }
.doc-line { margin: .1em 0 .3em; }
.doc-line.given { color: #33475e; }
.doc-line.ctx .blank { display: inline-block; min-width: 4em; border-bottom: 2px solid #9fb4cc; color: #2c4a6e; text-align: center; }
.lines { display: flex; flex-direction: column; gap: 2px; margin: .1em 0 .2em; }
.opt { margin: 0; padding: 0 .4em; border-radius: 8px; cursor: pointer; -webkit-tap-highlight-color: transparent; }
.lines .opt { padding: .05em .45em; }
.opt:hover { background: #f1f4f8; }
.opt.picked { background: var(--hl-yellow); }
.opt.right { background: var(--hl-green); }
.task.done .opt { cursor: default; }
.task.done .opt:not(.right):not(.picked) { color: #5b6878; }
.para .opt { padding: .05em .1em; box-decoration-break: clone; -webkit-box-decoration-break: clone; }
.words .w { cursor: pointer; border-radius: 5px; padding: 0 .06em; }
.words .w:hover { background: #eef3f9; }
.words .w.found, .words .w.right { background: var(--hl-green); }
.words .w.picked { background: var(--hl-yellow); }
.words .w.bad { text-decoration: underline wavy #d64541; text-decoration-thickness: 2px; text-underline-offset: 5px; }
.slash { color: #3f9a4a; font-weight: 700; }
.remed { border-left: 3px solid #e3e7ec; padding-left: 12px; margin: .2em 0 .4em; }
.remed .task { margin-bottom: .3em; }
.tactions { display: flex; align-items: center; gap: 14px; margin: .35em 0 .2em; flex-wrap: wrap; }
.answer-line { margin: .2em 0; color: #2f6340; }
.result-line { margin: 0 0 1em 44px; font-size: .95em; }

/* buttons that look like a classroom tool, not a web app */
.btn { border: 0; background: var(--navy); color: #fff; border-radius: 12px; padding: 7px 18px 8px; font-family: var(--school); font-size: 19px; line-height: 1.3; display: inline-flex; align-items: center; gap: 8px; box-shadow: 0 2px 0 var(--frame-dark); }
.btn:hover { background: var(--navy-2); }
.btn:active { transform: translateY(2px); box-shadow: none; }
.btn.ghost { background: #fff; color: #24578f; box-shadow: 0 0 0 1px #c9d5e3, 0 2px 0 #c9d5e3; }
.btn.danger { color: #b3362f; }
.btn.turn { font-size: 20px; }
.linkbtn { border: 0; background: transparent; color: #2a64a5; text-decoration: underline; text-underline-offset: 3px; font-family: var(--school); font-size: 17px; padding: 2px 4px; }
.linkbtn.small { font-size: 15px; padding: 0; }
.pfoot { margin: 2em 0 0 44px; min-height: 10px; }
.doc > .tactions { margin-left: 44px; }

/* ---------- writing regions: textarea over a highlight backdrop ---------- */
.rg { position: relative; margin: .1em 0 .3em; border-radius: 10px; }
.rg-back, .rg-ta { font: inherit; line-height: 1.75; letter-spacing: inherit; padding: 2px 8px; margin: 0; border: 0; white-space: pre-wrap; overflow-wrap: break-word; word-wrap: break-word; tab-size: 4; }
.rg-back { color: transparent; min-height: 1.75em; }
.rg-back mark { color: transparent; border-radius: 4px; padding: 0; }
.rg-back mark.m-card { background: var(--hl-yellow); }
.rg-back mark.m-old { background: #eef3f9; }
.rg-back mark.m-glow { background: var(--hl-green); }
.rg-back mark.hot { box-shadow: 0 0 0 2px #e0b93a; }
.rg-back .blank { background: #eef3fb; border-radius: 4px; }
.rg-ta { position: absolute; inset: 0; width: 100%; height: 100%; resize: none; overflow: hidden; background: transparent; color: var(--ink); outline: none; caret-color: var(--frame); }
.rg-ta::placeholder { color: #6b7684; }
.rg.inline-edit { background: #f5f7fa; }
.rg.inline-edit.active, .rg.inline-edit:focus-within { background: #fff; box-shadow: 0 0 0 2px #c4d7ee; }
.rg.ro { background: transparent; }
.rg.build { background: #edf7f5; min-height: 1.75em; box-shadow: inset 0 0 0 2px #bfe0da; }
.rg.build.ro.active { box-shadow: inset 0 0 0 2px #127368; }
.task.done .rg.build { background: transparent; box-shadow: none; }
.rg.lined .rg-back { background-image: linear-gradient(to bottom, transparent calc(1.75em - 1px), #e4e9ef calc(1.75em - 1px)); background-size: 100% 1.75em; background-position: 0 2px; }
.rg.lined { margin-left: 44px; }
.draft-wrap .rg.lined { margin-left: 0; }
.rg.name-line { display: inline-block; min-width: 9em; vertical-align: bottom; border-bottom: 2px solid #c9d3df; border-radius: 0; }

/* ---------- comments in the margin (like Word / Docs) ---------- */
.cmt, .cmt-dot { position: absolute; left: 14px; right: 12px; }
.cmt { background: #fff; border: 1px solid #e0e5eb; border-radius: 12px; padding: 9px 12px 10px; font-family: var(--school); font-size: 17px; line-height: 1.45; color: #233142; box-shadow: 0 1px 2px rgba(20, 40, 70, .06); }
.cmt::before { content: ''; position: absolute; left: -7px; top: 14px; width: 12px; height: 12px; background: #fff; border-left: 1px solid #e0e5eb; border-bottom: 1px solid #e0e5eb; transform: rotate(45deg); }
.cmt-h { display: flex; align-items: center; gap: 8px; margin-bottom: 3px; font-family: var(--ui); font-size: 13.5px; color: #4b5a6b; }
.cmt-h .av { width: 24px; height: 24px; border-radius: 50%; background: var(--frame); color: #fff; display: inline-flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 700; }
.cmt.glow .av { background: #3f9a4a; }
.cmt.note .av { background: #d08a1e; }
.cmt-say { margin-left: auto; border: 0; background: transparent; color: #7d95b3; padding: 2px; border-radius: 6px; }
.cmt-say:hover { color: var(--frame); background: #eef3f9; }
.cmt .zh { font-size: 14px; margin: 4px 0 0; }
.cmt-hint { margin-top: 6px; padding-top: 6px; border-top: 1px dashed #dfe4ea; color: #35506e; }
.cmt-old { color: #5b6878; text-decoration: line-through; font-size: 15px; margin-bottom: 2px; }
.cmt.resolved .cmt-t { color: #2f7a3b; }
.cmt.resolved .cmt-t::before { content: '✓ '; }
.cmt.meta { background: transparent; border: 0; box-shadow: none; padding: 0 4px; font-family: var(--ui); font-size: 12px; color: #5b6878; line-height: 1.35; }
.cmt.meta::before { display: none; }
.cmt.note-sticky { background: #fff8d8; border-color: #f0e2a6; }
.cmt.note-sticky::before { background: #fff8d8; border-color: #f0e2a6; }
.cmt.note-sticky .av { background: #8c5a2b; }
.sticky-list p { margin: 0 0 4px; font-size: 15.5px; line-height: 1.35; }
.cmt-dot { left: 14px; right: auto; width: 30px; height: 30px; border-radius: 50%; border: 1px solid #d5dce5; background: #fff; color: #5b6878; display: flex; align-items: center; justify-content: center; padding: 0; }
.cmt-dot.ok { color: #3f9a4a; }
.hot { background-color: #fff6d6; }
/* ---------- start ---------- */

/* ---------- Options dialog ---------- */

/* ---------- v6 strict 3-column page: rail | content + word grid (same edges) | Coach column with Back/Next ---------- */

/* ---------- v7 · S2 skill skip ---------- */
.skip-note { border-left: 4px solid var(--navy, #1c2c5b); background: #eef4fb; padding: 10px 14px; margin: 0 0 14px; border-radius: 6px; }

/* =====================================================================
 * v8 · top page bar + 2 columns + real page templates + choice questions
 * ===================================================================== */
:root { --rail-w: 0px; --pb-h: 62px; }
/* ---- 2 columns: content + grid | Coach (no side rail) ---- */
.rail, .page-dots { display: none !important; }
.stage { grid-template-columns: minmax(0, 1fr) var(--tutor-w); column-gap: 12px; padding: 0 12px; }
.panel { top: calc(52px + var(--pb-h) + 4px); left: 12px; width: min(700px, calc(100% - 24px)); max-height: calc(100% - 52px - var(--pb-h) - 60px); }
/* ---- the top page bar ---- */
.pagebar { flex: none; height: var(--pb-h); display: flex; align-items: center; gap: 14px; padding: 0 12px; background: var(--sky-3); border-bottom: 1px solid var(--line); }
.pb-lesson { flex: none; display: flex; align-items: center; gap: 2px; }
.pb-arrow { width: 44px; height: 44px; border: 0; border-radius: 50%; background: transparent; color: var(--navy); display: inline-flex; align-items: center; justify-content: center; }
.pb-arrow:hover:not(:disabled) { background: var(--sky-2); }
.pb-arrow.locked { color: #6b7684; }
.pb-arrow:disabled { opacity: 1; color: #b9c4d1; }
.pb-label { min-height: 44px; border: 1px solid #c4d8e8; background: #fff; border-radius: 22px; padding: 4px 12px 4px 16px; display: inline-flex; align-items: baseline; gap: 6px; color: var(--navy); font-size: 16px; white-space: nowrap; max-width: 330px; }
.pb-label:hover { background: var(--sky-2); }
.pb-label b { font-weight: 700; }
.pb-of { color: #4f5f73; font-size: 14px; }
.pb-t { color: #34466f; font-size: 14px; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
.pb-label .ico { align-self: center; color: #4f5f73; }
.pb-steps { flex: 1; min-width: 0; display: flex; align-items: flex-start; justify-content: flex-start; gap: 0; }
.ps { position: relative; flex: 0 1 64px; min-width: 44px; height: 54px; border: 0; background: transparent; padding: 2px 0 0; display: flex; flex-direction: column; align-items: center; gap: 2px; color: var(--navy); }
.ps::before { content: ''; position: absolute; top: 18px; left: calc(-50% + 18px); right: calc(50% + 18px); height: 2px; background: #c4d3e2; }
.ps:first-child::before { display: none; }
.ps.done::before, .ps.on::before { background: #7f9cc4; }
.ps-c { width: 34px; height: 34px; border-radius: 50%; border: 2px solid var(--navy); background: #fff; display: inline-flex; align-items: center; justify-content: center; font-size: 15px; font-weight: 700; font-family: var(--ui); transition: background .15s; }
.ps:hover .ps-c { background: var(--sky-2); }
.ps-m { font-size: 12px; line-height: 1.1; color: #4f5f73; font-family: var(--ui); white-space: nowrap; }
.ps.done .ps-c { background: var(--sky-2); border-color: #4a6fa5; color: #2f6b3d; }
.ps.on .ps-c { background: var(--navy); border-color: var(--navy); color: #fff; box-shadow: 0 0 0 4px var(--sky); }
.ps.on .ps-m { color: var(--navy); font-weight: 700; }
.ps.locked { cursor: not-allowed; }
.ps.locked .ps-c { border-color: #c3ccd8; color: #5f6b7a; background: #f7f9fb; }
.ps.skipped:not(.on) .ps-c { border-color: #8fbf84; background: #eef6eb; color: #2f6f3a; border-style: dashed; }
.ps.skipped .ps-m { color: #2f6f3a; }
.pb-sum { flex: none; font-size: 13px; color: #4f5f73; white-space: nowrap; }
.pd-tick { display: none; }
.ps.pdot, .ps.pdot.on, .ps.pdot.done, .ps.pdot.locked, .ps.pdot.skipped { width: auto; height: 54px; border: 0; border-radius: 10px; background: transparent; box-shadow: none; font-size: inherit; }
.ps.pdot:hover { background: transparent; }
.choice.card .ch-t { flex: 1 1 auto; }
/* ---- page head: number now counts inside the lesson ---- */
.sh-n { font-family: var(--ui); }

/* ---- the one template frame ---- */
.tpl-frame { display: flex; flex-direction: column; gap: .35em; min-width: 0; }
.tpl-prompt { margin: 0 0 .2em 44px; }
.tpl-ask { margin: 0; font-weight: 600; color: #22344a; }

.tpl-prompt .zh { margin: 0; }
.tpl-body { min-width: 0; }
.tpl-actions:empty { display: none; }
.tpl-actions { margin-left: 44px; }
.empty-state { margin-left: 44px; }
.tip { margin: 0 0 .2em 44px; }
.kbd-hint { font-family: var(--ui); font-size: 14px; color: #4f5f73; }
.ch-hint { margin: .1em 0 .35em; font-family: var(--ui); font-size: 15px; color: #34466f; }
.ch-hint b { color: var(--navy); }
.gal-note { margin: 0 0 1em 44px; font-family: var(--ui); font-size: 14px; color: #4f5f73; border-left: 4px solid var(--sky); padding: 4px 10px; }

/* ---- P3 Select: choice rows that look like a choice question ---- */
.choices { display: flex; flex-direction: column; gap: 10px; margin: .25em 0 .5em; max-width: 860px; }
.choice { position: relative; display: flex; align-items: center; gap: 14px; width: 100%; min-height: 56px; padding: 8px 16px 8px 10px; border: 2px solid #c9d6e3; border-radius: 14px; background: #fff; text-align: left; font-family: var(--school); font-size: 1em; line-height: 1.35; color: var(--ink); box-shadow: 0 2px 0 #dfe7ef; transition: border-color .12s, background .12s; -webkit-tap-highlight-color: transparent; }
.choice:hover:not(:disabled) { border-color: #7f9cc4; background: var(--sky-3); }
.choice:active:not(:disabled) { transform: translateY(1px); box-shadow: none; }
.ch-key { flex: none; width: 38px; height: 38px; border-radius: 50%; border: 2px solid #7f9cc4; background: #fff; color: var(--navy); display: inline-flex; align-items: center; justify-content: center; font-family: var(--ui); font-size: 17px; font-weight: 700; }
.choice.multi .ch-key { border-radius: 9px; }
.ch-t { flex: 1; min-width: 0; }
.ch-mark { flex: none; display: inline-flex; align-items: center; gap: 4px; font-family: var(--ui); font-size: 14px; font-weight: 700; color: #2f6b3d; white-space: nowrap; }
.ch-mark.no { color: #8a4b12; }
.choice.is-selected { border-color: var(--navy); background: var(--sky-2); box-shadow: 0 2px 0 #9fb4cc; }

.choice.is-correct { border-color: #2f7a3b; background: #e6f3e7; box-shadow: 0 2px 0 #b9dcbf; }
.choice.is-correct .ch-key { background: #2f7a3b; border-color: #2f7a3b; color: #fff; }
.choice.is-answer { border-color: #2f7a3b; border-style: dashed; background: #f1f8f1; }

.choice.is-wrong { border-color: #c26a2c; background: #fdf3ea; box-shadow: 0 2px 0 #efd3bc; }
.choice.is-wrong .ch-key { border-color: #c26a2c; color: #8a4b12; background: #fff; }
.choice.is-dim, .choice:disabled.is-dim { color: #5b6878; background: #fafbfc; border-color: #e1e7ee; box-shadow: none; }
.choice:disabled { cursor: default; opacity: 1; }
.task.in-check .choice.is-selected { box-shadow: 0 2px 0 #9fb4cc; }
/* A/B compare */
.choices.compare { flex-direction: row; align-items: stretch; max-width: none; }
.choice.card { flex-direction: column; align-items: flex-start; gap: 8px; padding: 12px 14px 14px; }
.choices.compare .choice { flex: 1 1 0; min-width: 0; }
.choices.compare .ch-key { position: absolute; top: 10px; right: 10px; }
.cmp-h { display: block; font-family: var(--ui); font-size: 14px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: #34466f; margin-bottom: 4px; padding-right: 44px; }
.cmp-t { display: block; font-size: .74em; line-height: 1.55; }
.choices.compare .ch-mark { align-self: flex-end; }
/* cards (choose a question, not scored) */
.choices.cards { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; max-width: 900px; margin-left: 44px; }
.choices.cards .choice { flex-direction: row; align-items: center; min-height: 64px; font-size: .84em; }
.tc-note { display: block; font-family: var(--ui); font-size: 13px; color: #34466f; margin-top: 2px; }
/* passage: tappable text stays text */
.passage .w, .mseg { padding: .05em .08em; }
.words .w.picked, .mseg.picked { background: var(--sky-2); box-shadow: inset 0 -3px 0 var(--navy); border-radius: 5px; }
.words .w.right, .mseg.right { background: var(--hl-green); box-shadow: inset 0 -3px 0 #2f7a3b; }
.words .w.bad, .mseg.bad { background: #fdf3ea; text-decoration: underline wavy #c26a2c; text-decoration-thickness: 2px; text-underline-offset: 5px; }
.words .w { min-height: 1.6em; display: inline-block; line-height: 1.6; }
/* label: a row of category tags per sentence */
.labels { display: flex; flex-direction: column; gap: 10px; max-width: 900px; margin: .25em 0 .5em; }
.lbl-row { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; padding: 8px 10px 8px 16px; border: 2px solid #dbe4ee; border-radius: 14px; background: #fff; }
.lbl-row.is-wrong { border-color: #c26a2c; background: #fdf3ea; }
.lbl-row.is-correct { border-color: #2f7a3b; background: #f1f8f1; }
.lbl-row.is-answer { border-color: #2f7a3b; border-style: dashed; }
.lbl-t { flex: 1 1 320px; min-width: 0; font-family: var(--school); line-height: 1.4; }
.lbl-tags { flex: none; display: inline-flex; gap: 8px; }
.lbl-tag { min-height: 48px; min-width: 96px; padding: 6px 16px; border: 2px solid #9fb4cc; border-radius: 24px; background: #fff; color: var(--navy); font-family: var(--ui); font-size: 16px; font-weight: 700; display: inline-flex; align-items: center; justify-content: center; gap: 6px; }
.lbl-tag:hover:not(:disabled) { background: var(--sky-3); border-color: var(--navy); }
.lbl-tag.is-selected { background: var(--navy); border-color: var(--navy); color: #fff; }
.lbl-tag.is-correct { background: #2f7a3b; border-color: #2f7a3b; color: #fff; }
.lbl-tag.is-wrong { background: #fff; border-color: #c26a2c; color: #8a4b12; }
.lbl-tag:disabled { opacity: 1; cursor: default; }
/* ---- P4 Sentence workbench ---- */
.bench { display: flex; flex-direction: column; gap: 4px; padding: 10px 14px 12px; margin: .2em 0 .3em; border: 1px solid #d5e0ea; border-radius: 14px; background: #f7fafd; max-width: 900px; }
.bench-k { font-family: var(--ui); font-size: 13px; font-weight: 700; letter-spacing: .04em; text-transform: uppercase; color: #4f5f73; }
.bench-src .doc-line.given { color: #33475e; margin: 0 0 .2em; padding: 2px 8px; border-left: 3px solid #c4d3e2; }
.bench .rg.inline-edit { background: #fff; box-shadow: inset 0 0 0 1px #c9d6e3; }
.bench .rg.inline-edit:focus-within, .bench .rg.inline-edit.active { box-shadow: 0 0 0 2px #4d8fd6; }
.bench .rg.build { background: #edf7f5; }
.bench.locked { background: #fbfaf7; border-color: #e3ddd2; }
.answer-line { margin: .2em 0; color: #2f6340; }
/* ---- P5 canvas / P6 recap ---- */
.canvas { margin-top: .1em; }
.ready .goal-list { margin-top: .2em; }
/* ---- P1 growth ---- */
.grow-pair { display: grid; grid-template-columns: 1fr 1fr; gap: 22px; margin: 0 0 .3em 44px; }
.grow-col .para-h { margin-left: 0; margin-top: 0; }
.grow-text { margin: 0; font-size: .78em; line-height: 1.6; }

.grow-text del, .grow-key del { color: #5b6878; text-decoration: line-through; text-decoration-color: #8a4b12; }
.grow-key { margin: 0 0 .6em 44px; }
.step-map li.cur { font-weight: 700; }
.sm-skip { display: inline-flex; align-items: center; gap: 3px; background: transparent; padding: 0; font-size: 13px; }
.skip-k { background: transparent; padding: 0; }
/* ---- iPad landscape / small laptops ---- */
@media (max-width: 1280px) { .pb-label { max-width: 270px; } }
@media (max-width: 1200px) { .pb-sum { display: none; } }

@media print { .pagebar { display: none !important; } }
@media (prefers-reduced-motion: reduce) { .nav-b.nudge, .gcell.shake, .gcell.hintpulse { animation: none; } * { transition: none !important; } }
/* v8 · short landscape screens (iPad 1024×768): tighter answer rows, still ≥ 48px */
@media (max-height: 790px) { .choices { gap: 6px; } .choice { min-height: 48px; padding: 4px 14px 4px 8px; } .choices + .tactions, .tpl-actions { margin-top: 4px; } }
/* v8.1: section tag (a step is a tag on the page, not a level) */
.tb-tag { flex: none; font-size: 12.5px; line-height: 1; padding: 5px 9px; border-radius: 999px; background: #e8eef6; color: #2d3f57; white-space: nowrap; align-self: center; }

/* ---------- v9 · Level home + learning path (above the lesson) ---------- */
.tb-crumb { flex: none; display: inline-flex; align-items: center; gap: 4px; max-width: 250px; min-height: 40px; padding: 0 12px 0 6px; border: 1px solid var(--line); border-radius: 20px; background: #fff; color: var(--navy); font-size: 14px; }

@media (max-width: 1100px) { .tb-crumb { max-width: 180px; } .tb-tag { display: none; } }

.home { display: none; position: fixed; inset: 0; z-index: 40; background: var(--sky-3); flex-direction: column; font-family: var(--ui); color: var(--ink); }

  <header class="topbar" id="topbar"></header>
  <div class="stage">
    <div class="center" id="center">
      <main class="sheet" id="sheet">
        <div class="sheet-head" id="sheetHead"></div>
        <div class="docScroll" id="docScroll"><div class="paper" id="paper"><noscript>Please turn on JavaScript to use this book.</noscript></div></div>
      </main>
      <div class="grid" id="grid" aria-label="Word grid"></div>
    </div>
    <aside class="tutor" id="tutor" aria-label="Coach">
      <div class="tutor-head" id="tutorHead"></div>
      <div class="tutorScroll" id="tutorScroll"><div class="margin" id="margin" aria-label="Comments"></div></div>
      <div class="sheet-foot" id="sheetFoot"></div>
    </aside>
  </div>
  <div class="scrim" id="scrim"></div>
  <section class="panel index-panel" id="indexPanel" aria-label="Index"></section>
  <section class="panel summary-panel" id="summaryPanel" aria-label="Unit summary"></section>
  <section class="drawer" id="drawer" aria-label="Menu" aria-hidden="true"></section>
</div>
<section class="home" id="home" aria-label="My writing levels and path"></section>
<div class="modal" id="modal"></div>
<script>
/* ==== analyzer.js: Offline checker (teacher-voice comments) ==== */
/* ===================================================================
 * Heuristic Analyzer (offline demo mode)
 * Produces the SAME JSON shape as the LLM prompts (see AI_PROMPTS).
 * Rules follow: writing_curriculum_design.md §1.8, §6.1 and mvp_prd.md §5.5, §7.1
 * =================================================================== */
var Analyzer = (function () {
  'use strict';

  var OPINION_RE = /\b(i think|i believe|i feel|i know|in my opinion|should|shouldn['’]?t|must|ought to|is better|are better|would be better|the best|is the best|i agree|i disagree|it is important|we need|needs? to)\b/i;
  var CLOSING_START_RE = /^(for (all )?these reasons|for this reason|in conclusion|that is why|that's why|this is why|so,? (that is why|i think|i believe|our|we|kids|every)|all in all|to sum up|in the end|in short|now you know|as you can see|because of this|because of these reasons)\b/i;
  var REASON_START_RE = /^(first(ly)?|second(ly)?|third(ly)?|another( big| good| important)? reason|one( big| good| important)? reason|the (first|second|third|last|other|best) reason|my (first|second|third|last|other) reason|also|in addition|plus|besides|finally|last(ly)?|next|on top of that)\b/i;
  var DETAIL_START_RE = /^(for example|for instance|such as|like when|one time|once|last (year|week|month|summer)|when i|when we|my )/i;
  var DETAIL_ANY_RE = /\b(for example|for instance|such as|one time|last (year|week|month|summer|sunday|weekend)|every (day|week|morning|night|sunday|monday|tuesday|wednesday|thursday|friday|saturday|weekend|summer|year)|my (mom|dad|mother|father|brother|sister|friend|friends|grandma|grandpa|grandmother|grandfather|family|teacher|cousin|class|aunt|uncle|neighbor)|in (science|math|art|class|music|pe)|\d+)\b/i;
  var VAGUE = ['good', 'bad', 'nice', 'fun', 'cool', 'great', 'awesome', 'stuff', 'things', 'thing', 'very', 'really', 'lot', 'okay', 'ok'];
  // Linking words counted for W.4.1.c / L2-06 (the unit check counts these; "first/second" are order words)
  var LINKING = [
    { w: 'for instance', job: 'example' }, { w: 'for example', job: 'example' }, { w: 'such as', job: 'example' },
    { w: 'in addition', job: 'adding' }, { w: 'also', job: 'adding' }, { w: 'another', job: 'adding' }, { w: 'plus', job: 'adding' }, { w: 'besides', job: 'adding' },
    { w: 'because', job: 'reason' }, { w: 'in order to', job: 'reason' }, { w: 'so that', job: 'reason' }
  ];
  var ORDER_WORDS = ['first', 'second', 'third', 'next', 'finally', 'lastly'];
  var STOP = ('a an the and or but so of to in on at for with is are was were be been it its this that these those i you we they he she my our your their his her ' +
    'should shouldn t not do does did have has had can could would will kids kid student students people every some any it s write paragraph tells tell opinion give gives two reasons reason better than more most there what which who how why when where').split(' ');
  var MISSPELL = {
    butterflys: 1, becuase: 1, beacuse: 1, becase: 1, alot: 1, freind: 1, freinds: 1, thier: 1, wich: 1, untill: 1, realy: 1, vegtables: 1, vegetabels: 1,
    intresting: 1, favrite: 1, favorit: 1, beutiful: 1, beautifull: 1, wierd: 1, recieve: 1, finaly: 1, togather: 1, tommorow: 1, tomorow: 1, scool: 1,
    shoud: 1, shuold: 1, garen: 1, sience: 1, excercise: 1, exersize: 1, helthy: 1, healty: 1, pepole: 1, peple: 1, diffrent: 1, enviroment: 1,
    beleive: 1, belive: 1, opinon: 1, gonna: 1, wanna: 1, everyday_: 1, libary: 1, probly: 1, sometime_: 1, whith: 1, becaus: 1, waht: 1, teh: 1, frist: 1
  };
  var COMMON_VERBS = ('am is are was were be been being have has had do does did can could will would should may might must ' +
    'like likes liked love loves loved need needs help helps get gets got go goes went play plays played see sees saw grow grows grew make makes made take takes took ' +
    'want wants think thinks thought know knows knew eat eats ate run runs ran give gives gave keep keeps kept learn learns feel feels felt look looks find finds found ' +
    'come comes came say says said live lives use uses work works plant plants cook cooks watch watches read reads write writes enjoy enjoys rest rests visit visits stay stays').split(' ');
  var SUBORD_START = /^(when|if|because|after|before|although|though|since|while|as|until|once|whenever|even though|in addition|for instance|for example|first|second|third|also|however|then|next|finally|so|yes|no|well|in my opinion|in conclusion|for these reasons|on (sunday|monday|tuesday|wednesday|thursday|friday|saturday|weekends?))\b/i;
  var SPLICE_AFTER = /^(i|we|they|he|she|it|you|there|this|that|these|those|my|our|his|her|their|kids|people|everyone|some|many)\b/i;
  var CONJ_PREV = ('and but so or because when if that which who after before while since until than where why how what as the a an to of in on at for with very').split(' ');
  var FUSED_AUX = /^(was|were|is|are|am|can|will|had|have|could|would)$/i;
  var FUSED_NOUN_EXCEPT = ('reason way time day place moment year week thing things one kind first last only').split(' ');

  function norm(text) { return String(text || '').replace(/[\u2018\u2019]/g, "'").replace(/[\u201C\u201D]/g, '"').replace(/\s+/g, ' ').trim(); }
  function words(text) { return (norm(text).toLowerCase().match(/[a-z]+(?:'[a-z]+)?/g) || []); }
  function wordCount(text) { return (norm(text).match(/[A-Za-z0-9]+(?:['’][A-Za-z]+)?/g) || []).length; }

  function splitSentences(text) {
    var t = norm(text);
    if (!t) return [];
    var out = [];
    var re = /[^.!?]+(?:[.!?]+["')\]]*|$)/g, m;
    while ((m = re.exec(t)) !== null) {
      var s = m[0].trim();
      if (s && /[A-Za-z0-9]/.test(s)) out.push(s);
      if (m.index === re.lastIndex) re.lastIndex++;
    }
    return out;
  }

  function contentWords(text) {
    return words(text).filter(function (w) { return w.length > 2 && STOP.indexOf(w) < 0; });
  }
  function stem(w) { return w.replace(/(ies)$/, 'y').replace(/(es|s)$/, '').replace(/(ing|ed)$/, ''); }
  function overlap(a, b) {
    var A = contentWords(a).map(stem), B = contentWords(b).map(stem), n = 0, seen = {};
    A.forEach(function (w) { if (!seen[w] && B.indexOf(w) >= 0) { n++; seen[w] = 1; } });
    return n;
  }
  function similarity(a, b) {
    var A = words(a), B = words(b);
    if (!A.length || !B.length) return 0;
    var setB = {}; B.forEach(function (w) { setB[w] = 1; });
    var inter = 0, setA = {};
    A.forEach(function (w) { if (!setA[w]) { setA[w] = 1; if (setB[w]) inter++; } });
    var union = Object.keys(setA).length + Object.keys(setB).length - inter;
    return union ? inter / union : 0;
  }
  function hasPhrase(text, phrase) { return new RegExp('\\b' + phrase.replace(/ /g, '\\s+') + '\\b', 'i').test(text); }
  function quote(s, max) {
    max = max || 15;
    var w = norm(s).split(' ');
    return w.length <= max ? norm(s) : w.slice(0, max).join(' ') + '…';
  }
  function cjkRatio(text) {
    var t = String(text || ''); if (!t.length) return 0;
    var c = (t.match(/[\u3400-\u9fff]/g) || []).length;
    var l = (t.match(/[A-Za-z]/g) || []).length;
    return c / Math.max(1, c + l);
  }
  function isVagueOnly(text) {
    var cw = words(text).filter(function (w) { return ['it', 'is', 'are', 'was', 'a', 'so', 'and', 'the', 'they', 'that', 'this', 'very', 'really', 'to'].indexOf(w) < 0; });
    if (!cw.length) return true;
    var vague = cw.filter(function (w) { return VAGUE.indexOf(w) >= 0; }).length;
    return cw.length <= 2 || vague / cw.length >= 0.5;
  }

  function linkingFound(text) {
    var found = [];
    LINKING.forEach(function (l) { if (hasPhrase(text, l.w)) found.push(l.w); });
    // "another" counts only as "another reason/thing/way..."
    return found;
  }

  function hasVerb(seg) {
    var ws = words(seg);
    return ws.some(function (w) { return COMMON_VERBS.indexOf(w) >= 0 || /n't$/.test(w) || (w.length > 4 && /ed$/.test(w)); });
  }

  /* --- run-on detection (L2-01) --- */
  function findRunOn(sentence) {
    var s = norm(sentence);
    // comma splice: "clause, pronoun ..." with a verb on both sides
    var parts = s.split(/,\s+/);
    if (parts.length > 1) {
      for (var i = 0; i < parts.length - 1; i++) {
        var before = parts.slice(0, i + 1).join(', ');
        var lastPart = parts[i];
        var after = parts[i + 1];
        if (!SPLICE_AFTER.test(after)) continue;
        if (/^(and|but|so|or|yet|because|when|if|which|who)\b/i.test(after)) continue;
        // the clause right before the comma must be independent
        if (SUBORD_START.test(lastPart) && i === 0) continue;
        if (wordCount(lastPart) < 3) continue;
        if (!hasVerb(lastPart) || !hasVerb(after)) continue;
        if (SUBORD_START.test(before) && i === 0) continue;
        return { type: 'comma_splice', at: after.split(' ')[0] };
      }
    }
    // fused sentence: "... noun we were ..."
    var ws = s.replace(/[.,!?;:"]/g, '').split(' ');
    for (var j = 1; j < ws.length - 1; j++) {
      var w = ws[j].toLowerCase(), prev = ws[j - 1].toLowerCase(), next = (ws[j + 1] || '').toLowerCase();
      if (['we', 'they', 'he', 'she', 'it', 'i'].indexOf(w) < 0) continue;
      if (!FUSED_AUX.test(next)) continue;
      if (CONJ_PREV.indexOf(prev) >= 0) continue;
      if (/,$/.test(s.split(' ')[j - 1] || '')) continue;
      var two = (ws[j - 2] || '').toLowerCase();
      if (two === 'the' && FUSED_NOUN_EXCEPT.indexOf(prev) >= 0) continue;
      if (['in', 'on', 'at', 'for', 'after', 'before', 'during', 'with', 'at'].indexOf(two) >= 0) continue; // intro prepositional phrase
      if (FUSED_NOUN_EXCEPT.indexOf(prev) >= 0 && ['day', 'time'].indexOf(prev) < 0) continue;
      if (j < 3) continue; // need a real clause before
      return { type: 'fused', at: ws[j] };
    }
    if (wordCount(s) >= 30 && !/,/.test(s)) return { type: 'too_long', at: null };
    return null;
  }

  function conventionsErrors(sents, raw) {
    var errs = [];
    sents.forEach(function (s, i) {
      var first = s.replace(/^["'(\s]+/, '').charAt(0);
      if (/[a-z]/.test(first)) errs.push({ type: 'capital', sentence_index: i, skill: 'ME', ccss: 'L.4.2.a' });
      if (/(^|\s)i(\s|'|,|\.|$)/.test(s)) errs.push({ type: 'lowercase_i', sentence_index: i, skill: 'ME', ccss: 'L.4.2.a' });
      var ro = findRunOn(s);
      if (ro) errs.push({ type: 'run_on', sub: ro.type, sentence_index: i, skill: 'L2-01', ccss: 'L.4.1.f' });
      words(s).forEach(function (w) { if (MISSPELL[w]) errs.push({ type: 'spelling', word: w, sentence_index: i, skill: 'ME', ccss: 'L.4.2.d' }); });
    });
    var t = norm(raw);
    if (t && !/[.!?]["')\]]*$/.test(t)) errs.push({ type: 'end_punct', sentence_index: sents.length - 1, skill: 'ME', ccss: 'L.4.2' });
    return errs;
  }

  function promptKeywords(prompt) {
    return contentWords(prompt || '').map(stem).filter(function (w, i, a) { return a.indexOf(w) === i; });
  }
  function relevant(text, prompt) {
    var keys = promptKeywords(prompt);
    if (!keys.length) return true;
    var T = contentWords(text).map(stem);
    return keys.some(function (k) { return T.indexOf(k) >= 0; });
  }

  /* --- structure analysis of an opinion paragraph --- */
  function analyzeStructure(text, prompt) {
    var sents = splitSentences(text);
    var res = { sentences: sents, words: wordCount(text), topicIndex: sents.length ? 0 : -1, closingIndex: -1, reasons: [], linking: linkingFound(text) };
    if (!sents.length) return res;
    var topic = sents[0];
    res.topicOpinion = OPINION_RE.test(topic) && relevant(topic, prompt || topic);
    res.topicHasOpinionWord = OPINION_RE.test(topic);
    var last = sents[sents.length - 1];
    if (sents.length >= 3) {
      var looksClosing = CLOSING_START_RE.test(last) || (OPINION_RE.test(last) && overlap(last, topic) >= 1 && !REASON_START_RE.test(last) && !DETAIL_START_RE.test(last));
      if (looksClosing) res.closingIndex = sents.length - 1;
    }
    res.closingSameAsTopic = res.closingIndex > 0 && similarity(last, topic) >= 0.85;
    var bodyEnd = res.closingIndex > 0 ? res.closingIndex : sents.length;
    var groups = [];
    for (var i = 1; i < bodyEnd; i++) {
      var s = sents[i];
      var isDetailStart = DETAIL_START_RE.test(s);
      var isReason = !isDetailStart && (REASON_START_RE.test(s) || /\b(also|another reason|in addition)\b/i.test(s));
      if (!groups.length || isReason) groups.push({ reasonIndex: i, sentences: [i] });
      else groups[groups.length - 1].sentences.push(i);
    }
    groups.forEach(function (g) {
      var rs = sents[g.reasonIndex];
      var elab = g.sentences.slice(1).filter(function (k) {
        var t = sents[k];
        return DETAIL_ANY_RE.test(t) || DETAIL_START_RE.test(t) || (wordCount(t) >= 5 && !isVagueOnly(t));
      });
      var inSentence = /\b(for example|for instance|such as|\d+)\b/i.test(rs) && wordCount(rs) >= 9;
      var becauseDetail = /\bbecause\b/i.test(rs) && wordCount(rs) >= 12;
      g.supported = elab.length > 0 || inSentence || becauseDetail;
      g.detailIndex = elab.length ? elab[0] : (g.supported ? g.reasonIndex : -1);
      g.detailWords = elab.reduce(function (n, k) { return n + wordCount(sents[k]); }, 0) + (inSentence || becauseDetail ? wordCount(rs) - 5 : 0);
      g.vague = isVagueOnly(rs.replace(REASON_START_RE, ''));
    });
    res.reasons = groups;
    res.supportedCount = groups.filter(function (g) { return g.supported; }).length;
    res.orderWords = ORDER_WORDS.filter(function (w) { return hasPhrase(text, w); });
    return res;
  }

  function levelWord(score) { return ['', 'Not yet', 'Getting there', 'Got it', 'Wow'][score] || ''; }

  /* --- main: rubric scoring + feedback for the opinion paragraph --- */
  function scoreParagraph(input) {
    var text = norm(input.text), prompt = input.prompt || '';
    var st = analyzeStructure(text, prompt);
    var sents = st.sentences, w = st.words;
    var errs = conventionsErrors(sents, text);
    var out = { source: 'demo', confidence: 0.6, safety_flag: false, sentences: sents, word_count: w, linking_words_found: st.linking.slice() };

    // Task completion (0–2)
    var tc = 0;
    if (cjkRatio(text) > 0.3) tc = 0;
    else if (w < 10) tc = 0;
    else if ((st.topicHasOpinionWord || OPINION_RE.test(text)) && relevant(text, prompt) && w >= 40) tc = 2;
    else tc = 1;
    out.task_completion = {
      score: tc,
      comment: tc === 2 ? 'You wrote an opinion paragraph that answers the question.' : tc === 1 ? 'You started! Make sure you tell your opinion about the question and write at least 80 words.' : 'Let\'s get started. Write your opinion about the question in English.',
      zh: tc === 2 ? '你写了一段回答题目的观点段落。' : tc === 1 ? '开了个好头！记得针对题目说出你的观点，并写到 80 词左右。' : '我们开始吧：用英文写出你对这个问题的看法。'
    };

    if (tc === 0) {
      out.scores = {
        organization_purpose: { score: 1, comment: 'Not enough writing yet to see a top bun and a bottom bun.', zh: '内容还不够，看不出开头句和结尾句。' },
        evidence_elaboration: { score: 1, comment: 'Not enough writing yet to see reasons and details.', zh: '内容还不够，看不出理由和细节。' },
        language_use: { score: 1, comment: 'Write a few more sentences so we can look at your words.', zh: '再多写几句，我们才能看你的用词。' },
        conventions: { score: 0, comment: 'Write in full English sentences.', zh: '请用完整的英文句子来写。' }
      };
      out.glow = { text: 'You have started. That is the hardest part.', zh: '你已经开始了，这是最难的一步。', sentence_index: null };
      out.cards = [{
        id: 'c1', issue_type: 'not_started', dimension: 'organization_purpose', skill_id: 'L2-04', ccss: 'W.4.1.a', sentence_index: null, quote: '',
        message: cjkRatio(text) > 0.3 ? 'Let\'s write it in English. You could start with "I think".' : 'Start with one sentence that tells me what you think.',
        zh: cjkRatio(text) > 0.3 ? '试着用英文写出你的想法，可以从 "I think ..." 开始。' : '先写一句话，说出你对这个问题的看法。',
        hint_question: 'What do you think about the question? Yes or no? Why?', hint_zh: '你对这个问题怎么看？同意还是不同意？为什么？'
      }];
      out.checks = { topic_opinion: false, two_reasons_supported: false, linking_word: false, closing_sentence: false };
      out.errors = errs;
      return finalizeWithPrevious(out, input);
    }

    // Organization/Purpose 1–4
    var op = 1 + (st.topicOpinion ? 1 : 0) + (st.closingIndex > 0 && !st.closingSameAsTopic ? 1 : 0) + (st.reasons.length >= 2 && (st.linking.length + st.orderWords.length) >= 2 ? 1 : 0);
    if (st.closingSameAsTopic && op < 4) op = Math.max(op, 2);
    // Evidence/Elaboration 1–4
    var r = st.reasons.length, s = st.supportedCount;
    var allSupported = r > 0 && s === r;
    var avgDetail = s ? st.reasons.reduce(function (n, g) { return n + (g.supported ? g.detailWords : 0); }, 0) / s : 0;
    var ee = 1 + (r >= 2 ? 1 : 0) + (s >= 1 ? 1 : 0) + (s >= 2 && allSupported && r <= 2 && avgDetail >= 6 ? 1 : 0);
    if (r >= 3 && allSupported && avgDetail >= 6) ee = Math.max(ee, 3);
    // Language Use 1–4
    var L = st.linking.length + (st.orderWords.length ? 1 : 0);
    var lens = sents.map(wordCount), mean = lens.reduce(function (a, b) { return a + b; }, 0) / Math.max(1, lens.length);
    var sd = Math.sqrt(lens.reduce(function (a, b) { return a + (b - mean) * (b - mean); }, 0) / Math.max(1, lens.length));
    var complex = /\b(because|when|if|although|since|so that|while)\b/i.test(text);
    var variety = sd >= 2.5 || complex;
    var allW = words(text), vagueN = allW.filter(function (x) { return VAGUE.indexOf(x) >= 0; }).length, vagueRatio = vagueN / Math.max(1, allW.length);
    var lu = 1 + (L >= 1 ? 1 : 0) + ((L >= 3 || (L >= 2 && variety)) ? 1 : 0) + (L >= 2 && variety && vagueRatio < 0.05 && mean >= 7 ? 1 : 0);
    // Conventions 0–2
    var e = errs.length, dens = e / Math.max(1, w) * 100;
    var conv = e <= 1 ? 2 : (dens <= 8 ? 1 : 0);
    if (w < 40 && e >= 3) conv = 0;

    var detailSent = -1;
    st.reasons.forEach(function (g) { if (detailSent < 0 && g.supported && g.detailIndex >= 0) detailSent = g.detailIndex; });

    out.scores = {
      organization_purpose: { score: op, comment: opComment(st, op), zh: opZh(st, op) },
      evidence_elaboration: { score: ee, comment: eeComment(st, ee, sents, detailSent), zh: eeZh(st, ee) },
      language_use: { score: lu, comment: st.linking.length ? 'Linking words I found: ' + st.linking.concat(st.orderWords).slice(0, 4).join(', ') + '.' : 'Try linking words like "for instance" and "in addition."', zh: st.linking.length ? '找到的连接词：' + st.linking.concat(st.orderWords).slice(0, 4).join('、') + '。' : '试试用 for instance、in addition 这样的连接词。' },
      conventions: { score: conv, comment: e === 0 ? 'Capitals, end marks, and sentences look correct.' : e === 1 ? 'Almost no mistakes. Check the comment in the margin.' : 'A few capital, spelling, or run-on mistakes. Check the comments.', zh: e === 0 ? '大小写、句末标点和句子都正确。' : e === 1 ? '几乎没有错误，看看页边的批注。' : '有几处大小写、拼写或连写句错误，看看卡片。' }
    };

    // Glow (1 highlight)
    if (detailSent >= 0) out.glow = { text: 'I can picture this. Your example really shows your reason.', zh: '我能想象出这个画面，你的例子把理由讲清楚了。', sentence_index: detailSent };
    else if (st.topicOpinion) out.glow = { text: 'Your first sentence tells me exactly what you think.', zh: '你的第一句清楚地告诉我你的想法。', sentence_index: 0 };
    else if (st.linking.length) out.glow = { text: '"' + st.linking[0] + '" helps me follow your ideas.', zh: '"' + st.linking[0] + '" 让我能跟上你的思路。', sentence_index: null };
    else out.glow = { text: 'You stayed on the question the whole way through.', zh: '你从头到尾都围绕着题目写。', sentence_index: null };

    // Issue cards: content first, then form; L2 max 2 (PRD 5.5)
    var content = [], form = [];
    if (!st.topicOpinion) content.push({ issue_type: 'no_opinion_topic', dimension: 'organization_purpose', skill_id: 'L2-04', ccss: 'W.4.1.a', sentence_index: 0,
      message: 'I\'m not sure what you think yet. Can your first sentence tell me?',
      zh: '我还不知道你怎么想。第一句能告诉我吗？',
      hint_question: 'Do you think yes or no? Which opinion word could you use: think, believe, or should?', hint_zh: '你的答案是"是"还是"不是"？可以用哪个观点词：think、believe 还是 should？' });
    if (r < 2) content.push({ issue_type: 'few_reasons', dimension: 'evidence_elaboration', skill_id: 'L2-05', ccss: 'W.4.1.b', sentence_index: st.reasons.length ? st.reasons[0].reasonIndex : null,

  // Revision comparison: did each previous card get solved? (IT-23)

  function solvedNote(t) {
    return ({ reason_no_detail: 'Fixed. Each reason has its own example now.', too_many_reasons: 'Fixed. Two reasons, each with an example.', few_reasons: 'Fixed. Now I see two reasons.',
      no_opinion_topic: 'Fixed. Now I know what you think.', no_closing: 'Fixed. Your paragraph has an ending now.', closing_same: 'Fixed. You said it in new words.',
      no_linking: 'Fixed. I can follow your ideas now.', run_on: 'Fixed. Two clear sentences.', capital_punct: 'Fixed.', spelling: 'Fixed.' })[t] || 'Fixed.';

  function editRatio(a, b) {
    var A = words(a), B = words(b);
    if (!A.length) return 1;
    var n = A.length, m = B.length, prev = [], cur = [], i, j;
    for (j = 0; j <= m; j++) prev[j] = j;
    for (i = 1; i <= n; i++) {
      cur = [i];
      for (j = 1; j <= m; j++) cur[j] = Math.min(prev[j] + 1, cur[j - 1] + 1, prev[j - 1] + (A[i - 1] === B[j - 1] ? 0 : 1));

    return prev[m] / Math.max(n, m);
  }
  // word-level diff for the before/after view
  function diffWords(a, b) {
    var A = norm(a).split(' '), B = norm(b).split(' ');
    var n = A.length, m = B.length, dp = [], i, j;
    for (i = 0; i <= n; i++) { dp[i] = []; for (j = 0; j <= m; j++) dp[i][j] = 0; }
    for (i = n - 1; i >= 0; i--) for (j = m - 1; j >= 0; j--) dp[i][j] = A[i] === B[j] ? dp[i + 1][j + 1] + 1 : Math.max(dp[i + 1][j], dp[i][j + 1]);
    var out = []; i = 0; j = 0;
    while (i < n && j < m) {
      if (A[i] === B[j]) { out.push({ t: 'same', w: A[i] }); i++; j++; }
      else if (dp[i + 1][j] >= dp[i][j + 1]) { out.push({ t: 'del', w: A[i] }); i++; }
      else { out.push({ t: 'add', w: B[j] }); j++; }
    }
    while (i < n) out.push({ t: 'del', w: A[i++] });
    while (j < m) out.push({ t: 'add', w: B[j++] });
    return out;
  }

  /* --- Plan coach (IT-25) offline: find empty / vague / duplicate boxes --- */
  function coachPlan(plan, prompt) {

      else if (isVagueOnly(v) || wordCount(v) < 2) status = 'vague';

    if (zone === 'r1') return (DETAIL_ANY_RE.test(t) || splitSentences(t).length >= 2) ? { ok: true, msg: 'Reason + detail ✓' } : { ok: false, msg: 'Add a fact or example (For example, ...).' };

tion, because。"},"ccss":["W.4.1.c"],"example":{"weak":"Gardens are good for health. We can grow vegetables for lunch.","strong":"Gardens are good for health. For instance, we can grow vegetables for lunch."},"teacher":{"strand":"PO","v2_points":[["Adding a reason: also, in addition","补充理由：also、in addition"],["Giving an example: for instance, for example","举例：for instance、for example"],["Telling why: because, in order to","说明原因：because、in order to"],["At the start of a sentence, put a comma after it: \"In addition, ...\"","放在句首时，后面加逗号：\"In addition, ...\""]]}},{"id":"L2-01","short":"Run-ons","title":"One idea, one sentence","zh_title":"一个意思，一个句子","teach":{"en":"Two ideas? Use a period, or join them with , and / , but / , so / because.","zh":"两个意思？用句号断开，或者用 , and / , but / , so / because 连接。"},"ccss":["L.4.1.f","L.4.2.c"],"example":{"weak":"We planted seeds, they grew fast.","strong":"We planted seeds, and they grew fast."},"teacher":{"strand":"SC","v2_points":[["A run-on is two sentences glued together with only a comma — or with nothing.","连写句：两个句子只用逗号（或什么都不用）粘在一起。"],["Fix 1: Use a period and a capital letter.","改法 1：用句号，下一句首字母大写。"],["Fix 2: Use a comma + and / but / so.","改法 2：用逗号 + and / but / so。"],["Fix 3: Use because or when.","改法 3：用 because 或 when。"]]}}],"grids":{"_about":"Each tab is one colored grid. \"chunks\" = bigger phrase cells (most support), \"words\" = single-word cells. A page/task picks tabs + a level: chunks → words → keyboard (grid folded away, can open) → off (locked, keyboard only).","tabs":{"opinion":{"label":"Opinion","zh":"观点","color":"#c0392b","chunks":[{"t":"I think","zh":"我认为"},{"t":"I believe","zh":"我相信"},{"t":"In my opinion,","zh":"在我看来"},{"t":"our school should","zh":"我们学校应该"},{"t":"kids should","zh":"孩子们应该"},{"t":"should not","zh":"不应该"},{"t":"is the best","zh":"是最好的"},{"t":"would be","zh":"会是"}],"words":[{"t":"I","zh":"我"},{"t":"think","zh":"认为"},{"t":"believe","zh":"相信"},{"t":"should","zh":"应该"},{"t":"not","zh":"不"},{"t":"best","zh entence an opinion or a fact? Tap a label for every sentence.","zh":"每句是观点还是事实？给每一句点一个标签。"},"categories":["Opinion","Fact"],"lines":["Dogs are the best pets for families.","Many families have dogs.","In my opinion, every kid should learn to swim.","Water boils at 100 degrees."],"answers":[0,1,0,1],"why":{"en":"Opinions tell what someone thinks: best, should, in my opinion. Facts can be checked.","zh":"观点说出某人的想法：best、should、in my opinion。事实可以查证。"},"ok":{"en":"Yes. Each one is sorted.","zh":"对，每一句都分好了。"}}}],"step_tags":[{"id":"L2-04","skill":"L2-04","label":{"en":"Skill 1","zh":"技能 1"},"title":{"en":"Topic sentences","zh":"主题句"}},{"id":"L2-05","skill":"L2-05","label":{"en":"Skill 2","zh":"技能 2"},"title":{"en":"Reasons & closing","zh":"理由和结尾"}},{"id":"L2-06","skill":"L2-06","label":{"en":"Skill 3","zh":"技能 3"},"title":{"en":"Linking words","zh":"连接词"}},{"id":"L2-01","skill":"L2-01","label":{"en":"Skill 4","zh":"技能 4"},"title":{"en":"Run-on sentences","zh":"连写句"}},{"id":"model","label":{"en":"Model","zh":"范文"},"title":{"en":"A strong paragraph","zh":"一篇好段落"}},{"id":"plan","label":{"en":"Plan","zh":"计划"},"title":{"en":"Plan your paragraph","zh":"计划你的段落"}},{"id":"draft","label":{"en":"Draft","zh":"写初稿"},"title":{"en":"Write your paragraph","zh":"写你的段落"}},{"id":"revise","label":{"en":"Revise","zh":"修改"},"title":{"en":"Read my comments and revise","zh":"读批注，改一改"}},{"id":"report","label":{"en":"Report","zh":"总结"},"title":{"en":"My finished paragraph","zh":"我完成的段落"}}],"lessons":[{"id":"lesson1","n":1,"title":{"en":"Topic sentences","zh":"主题句"},"goal":{"en":"I can write a topic sentence that tells the topic and what I think.","zh":"我能写出说明话题和观点的主题句。"},"short":false,"screens":[{"id":"L2-04.learn","step":"L2-04","kind":"learn","page":"L2-04.skill","title":{"en":"Learn","zh":"学一学"},"min":3,"template":"P2","params":{"body":"rule_pair","diagram":"hamburger","skip_offer":true},"coach":{"arrive":{"en":"A topic sentence is the top bun. It tells the reader two things: what you are writing about, and what you think about it.","zh":"主题句就是上层面包。它告诉读者两件事：你写什么，你怎么想。"},"beats":[{"en":"Look: “Our class should get a fish.” The topic is a fish. The word “should” tells me what you think.","zh":"看：“Our class should get a fish.” 话题是鱼，“should” 说出你的想法。"},{"en":"Now compare: “Fish live in water.” That is true, but it is only a fact. Nobody can argue with it, so there is nothing to explain.","zh":"比一比：“Fish live in water.” 是真的，但只是事实，没什么可解释的。"},{"en":"Opinion words help: I think, I believe, should, best. If your sentence has a topic and one of these, you have a top bun.","zh":"观点词有帮助：I think、I believe、should、best。有话题加上观点词，就是上层面包。"}]}},{"id":"L2-04.t.ts1","step":"L2-04","kind":"task","page":"L2-04.skill","task":"ts1","title":{"en":"Pick the topic sentence","zh":"选出主题句"},"min":2,"template":"P3","params":{"layout":"list","unit":"option","pick":"single","scored":"auto"},"coach":{"arrive":{"en":"Read all three. Ask yourself: which one tells the topic AND what the writer thinks?","zh":"三句都读一读：哪一句既有话题又有作者的想法？"}}},{"id":"L2-04.t.ts4","step":"L2-04","kind":"task","page":"L2-04.skill","task":"ts4","title":{"en":"Find the opinion word","zh":"找出观点词"},"min":2,"template":"P3","params":{"layout":"passage","unit":"word","pick":"single","scored":"auto"},"coach":{"arrive":{"en":"Opinion words are little signals. Find the word that tells you this is what someone thinks, not a fact.","zh":"观点词是小信号。找出表示“这是某人的想法”的那个词。"}}},{"id":"L2-04.t.ts3","step":"L2-04","kind":"task","page":"L2-04.skill","task":"ts3","title":{"en":"Opinion or fact?","zh":"观点还是事实？"},"min":2,"template":"P3","params":{"layout":"list","unit":"option","pick":"multi","scored":"auto"},"coach":{"arrive":{"en":"A fact can be checked: you could count it or look it up. An opinion is what someone thinks. Find every opinion.","zh":"事实可以查证，观点是某人的想法。把观点都找出来。"}}},{"id":"L2-04.t.ss.L2-04","step":"L2-04","kind":"task","page":"L2-04.skill","task":"ss.L2-04","title":{"en":"Build a topic sentence","zh":"拼一个主题句"},"min":2,"template":"P4","params":{"action":"build","input":"set","build_unit":"word","order":"guided","distractors":0,"scoring":"auto","evidence":"practice"},"coach":{"arrive":{"en":"Build it in order and listen to how it sounds. Notice where the opinion word sits.","zh":"按顺序拼出来，听听它的声音，注意观点词在哪里。"}}},{"id":"L2-04.t.ts8","step":"L2-04","kind":"task","page":"L2-04.skill","task":"ts8","title":{"en":"Finish the sentence","zh":"把句子写完整"},"min":1,"template":"P4","params":{"input":"chunks","source":"frame","action":"fill","scoring":"rule+ai","evidence":"practice"},"coach":{"arrive":{"en":"This frame gives you the start. You choose what recess should be, and then a real reason after “because.”","zh":"句子框给了开头。你来选课间应该怎样，再在 because 后写一个真正的理由。"}}},{"id":"L2-04.apply","step":"L2-04","kind":"apply","page":"L2-04.apply","title":{"en":"Try it in your own writing","zh":"在自己的写作里试一试"},"min":5,"template":"P5","params":{"purpose":"apply","phase":"draft","input":"words","feedback":"constraint","evidence":"apply"},"coach":{"arrive":{"en":"Now it’s your turn. Each line should name the garden and say what you think. Try three different ways to say it.","zh":"轮到你了。每一行都要说到花园，并说出你的想法。试三种不同的说法。"}}},{"id":"L2-04.check","step":"L2-04","kind":"check","page":"L2-04.check","title":{"en":"Check","zh":"小测"},"min":3,"template":"P7","params":{"purpose":"mastery","preset":"assessment","items":"3 auto + 1 writing","pass_rule":">=2/3 auto AND writing correct","second_set":true,"input":"keyboard"},"coach":{"arrive":{"en":"This is a check, so I won’t give hints. Take your time and read every choice. I’ll explain each answer when you finish.","zh":"这是小测，我不给提示。慢慢读每个选项，做完后我会解释每一题。"}}}],"min":20,"next":{"en":"Reasons & closing","zh":"理由和结尾"}},{"id":"lesson2","n":2,"title":{"en":"Reasons & closing","zh":"理由和结尾"},"goal":{"en":"I can give reasons with examples and end with a closing sentence.","zh":"我能给出带例子的理由，并用结尾句收尾。"},"short":false,"screens":[{"id":"L2-05.learn","step":"L2-05","kind":"learn","page":"L2-05.skill","title":{"en":"Learn","zh":"学一学"},"min":3,"template":"P2","params":{"body":"rule_pair","diagram":"hamburger","skip_offer":true},"coach":{"arrive":{"en":"The middle of the hamburger holds your reasons. A reason tells WHY. A detail shows it, so the reader can picture it.","zh":"汉堡中间放理由。理由说“为什么”，细节把它展示出来，让读者看得见。"},"beats":[{"en":"Reason: “Recess helps us learn.” That tells why. Detail: “After I run, I can sit still in math.” That shows it.","zh":"理由：“Recess helps us learn.” 细节：“After I run, I can sit still in math.” 细节把理由展示出来。"},{"en":"Every sentence must stay on topic. If a sentence is about something else, the reader gets lost. Take it out.","zh":"每一句都要扣住话题。跑题的句子会让读者迷路，要删掉。"},{"en":"The bottom bun is the closing. It says your opinion again, in new words. “For these reasons, …” is a good way to start.","zh":"下层面包是结尾句，用新的话再说一次观点。可以用 “For these reasons, …” 开头。"}]}},{"id":"L2-05.t.sc1","step":"L2-05","kind":"task","page":"L2-05.skill","task":"sc1","title":{"en":"Which detail fits?","zh":"哪个细节合适？"},"min":2,"template":"P3","params":{"layout":"list","unit":"option","pick":"single","scored":"auto"},"coach":{"arrive":{"en":"A detail has to prove the reason. Read the reason first. Then ask: which sentence shows that it is true?","zh":"细节要证明理由。先读理由，再问：哪一句能证明它？"}}},{"id":"L2-05.t.sc7","step":"L2-05","kind":"task","page":"L2-05.skill","task":"sc7","title":{"en":"Find the off-topic sentence","zh":"找出跑题的句子"},"min":2,"template":"P3","params":{"layout":"passage","unit":"sentence","pick":"single","scored":"auto"},"coach":{"arrive":{"en":"This paragraph is about pets. Read each sentence and ask: is this about pets?","zh":"这段话写宠物。每读一句就问：这句和宠物有关吗？"}}},{"id":"L2-05.t.sc3","step":"L2-05","kind":"task","page":"L2-05.skill","task":"sc3","title":{"en":"Build the paragraph","zh":"拼出整段"},"min":2,"template":"P4","params":{"action":"build","input":"set","build_unit":"sentence","order":"free","distractors":0,"scoring":"auto","evidence":"practice"},"coach":{"arrive":{"en":"Think top to bottom: opinion, reason, its example, next reason, closing.","zh":"从上往下想：观点、理由、例子、第二个理由、结尾。"}}},{"id":"L2-05.t.sc4","step":"L2-05","kind":"task","page":"L2-05.skill","task":"sc4","title":{"en":"Show me an example","zh":"举个例子"},"min":2,"template":"P4","params":{"input":"chunks","source":"given","action":"expand","scoring":"rule+ai","evidence":"practice"},"coach":{"arrive":{"en":"“A garden helps us learn” is a reason. Show me what we could really learn there. Name something you could see or measure.","zh":"“A garden helps us learn” 是理由。告诉我在那里真能学到什么，说出看得见或量得出的东西。"}}},{"id":"L2-05.t.sc5","step":"L2-05","kind":"task","page":"L2-05.skill","task":"sc5","title":{"en":"Choose a closing","zh":"选一个结尾句"},"min":1,"template":"P3","params":{"layout":"list","unit":"option","pick":"single","scored":"auto"},"coach":{"arrive":{"en":"A closing should sound like the topic sentence, but not copy it. Look for the same opinion in new words.","zh":"结尾句要和主题句意思一样，但不能照抄。找用新话说同一个观点的那句。"}}},{"id":"L2-05.apply","step":"L2-05","kind":"apply","page":"L2-05.apply","title":{"en":"Try it in your own writing","zh":"在自己的写作里试一试"},"min":5,"template":"P5","params":{"purpose":"apply","phase":"draft","input":"words","feedback":"constraint","evidence":"apply"},"coach":{"arrive":{"en":"Write about a place you love. Start with your opinion, give a reason with something I can picture, and close it up.","zh":"写一个你喜欢的地方。先说观点，给一个看得见的理由，再收尾。"}}},{"id":"L2-05.check","step":"L2-05","kind":"check","page":"L2-05.check","title":{"en":"Check","zh":"小测"},"min":3,"template":"P7","params":{"purpose":"mastery","preset":"assessment","items":"3 auto + 1 writing","pass_rule":">=2/3 auto AND writing correct","second_set":true,"input":"keyboard"},"coach":{"arrive":{"en":"Check time. No hints here, just your best thinking. I’ll go through every answer with you after.","zh":"小测时间。这里没有提示，尽力想。做完我和你一起看每一题。"}}}],"min":20,"next":{"en":"Linking words","zh":"连接词"}},{"id":"lesson3","n":3,"title":{"en":"Linking words","zh":"连接词"},"goal":{"en":"I can use linking words to connect my opinion and reasons.","zh":"我能用连接词把观点和理由连起来。"},"short":false,"screens":[{"id":"L2-06.learn","step":"L2-06","kind":"learn","page":"L2-06.skill","title":{"en":"Learn","zh":"学一学"},"min":3,"template":"P2","params":{"body":"rule_pair","diagram":"hamburger","skip_offer":true},"coach":{"arrive":{"en":"Linking words are signposts. They tell the reader what is coming next, so they don’t get lost.","zh":"连接词像路标，告诉读者接下来是什么。"},"beats":[{"en":"“For example,” and “For instance,” mean: an example is coming. “In addition,” means: here is another reason.","zh":"“For example,” “For instance,” 表示下面是例子；“In addition,” 表示还有一个理由。"},{"en":"“In order to” tells the purpose, the why: “We walk in order to get exercise.”","zh":"“In order to” 说明目的：“We walk in order to get exercise.”"},{"en":"When a linking word starts a sentence, put a comma right after it: “For instance, we can grow beans.”","zh":"连接词放在句首时，后面马上加逗号：“For instance, we can grow beans.”"}]}},{"id":"L2-06.t.lw1","step":"L2-06","kind":"task","page":"L2-06.skill","task":"lw1","title":{"en":"Fill the gap","zh":"填空"},"min":2,"template":"P4","params":{"input":"chunks","source":"given","action":"fill","scoring":"rule","evidence":"practice"},"coach":{"arrive":{"en":"Read the first sentence. Is the second one an example of it, or a new reason? Choose the signpost that fits.","zh":"读第一句。第二句是它的例子，还是新理由？选合适的路标。"}}},{"id":"L2-06.t.lw6","step":"L2-06","kind":"task","page":"L2-06.skill","task":"lw6","title":{"en":"Fix the missing mark","zh":"补上标点"},"min":2,"template":"P4","params":{"input":"chunks","source":"given","action":"fix","scoring":"rule","evidence":"practice"},"coach":{"arrive":{"en":"Something small is missing. Read it out loud. Where do you take a tiny breath?","zh":"少了一个小东西。读出声，你在哪里会稍微停一下？"}}},{"id":"L2-06.t.lw3","step":"L2-06","kind":"task","page":"L2-06.skill","task":"lw3","title":{"en":"Words that bring an example","zh":"引出例子的词"},"min":2,"template":"P3","params":{"layout":"list","unit":"option","pick":"multi","scored":"auto"},"coach":{"arrive":{"en":"Some of these words bring in an example. Others add a reason or tell why. Find only the example words.","zh":"有的词引出例子，有的加理由或说原因。只找引出例子的词。"}}},{"id":"L2-06.t.lw5","step":"L2-06","kind":"task","page":"L2-06.skill","task":"lw5","title":{"en":"Join with “In addition,”","zh":"用 In addition 连接"},"min":2,"template":"P4","params":{"input":"chunks","source":"given","action":"combine","scoring":"rule","evidence":"practice"},"coach":{"arrive":{"en":"Two sentences, one idea each. “In addition,” tells me the second one is another reason.","zh":"两句话，各一个想法。“In addition,” 告诉我第二句是另一个理由。"}}},{"id":"L2-06.t.lw4","step":"L2-06","kind":"task","page":"L2-06.skill","task":"lw4","title":{"en":"Build: “in order to”","zh":"拼句：in order to"},"min":1,"template":"P4","params":{"action":"build","input":"set","build_unit":"phrase","order":"free","distractors":2,"scoring":"auto","evidence":"practice"},"coach":{"arrive":{"en":"This sentence tells why we walk. Which words carry the “why”?","zh":"这句话说我们为什么走路。哪几个词表示“为什么”？"}}},{"id":"L2-06.apply","step":"L2-06","kind":"apply","page":"L2-06.apply","title":{"en":"Try it in your own writing","zh":"在自己的写作里试一试"},"min":5,"template":"P5","params":{"purpose":"apply","phase":"draft","input":"words","feedback":"constraint","evidence":"apply"},"coach":{"arrive":{"en":"Use the signposts in your own writing: one example with “For instance,” and a second reason with “In addition,”.","zh":"在你自己的写作里用路标：用 “For instance,” 举例，用 “In addition,” 加第二个理由。"}}},{"id":"L2-06.check","step":"L2-06","kind":"check","page":"L2-06.check","title":{"en":"Check","zh":"小测"},"min":3,"template":"P7","params":{"purpose":"mastery","preset":"assessment","items":"3 auto + 1 writing","pass_rule":">=2/3 auto AND writing correct","second_set":true,"input":"keyboard"},"coach":{"arrive":{"en":"This check is about linking words. No hints, but you know these signposts. I’ll explain each one at the end.","zh":"这次小测考连接词。没有提示，但你认识这些路标。最后我会逐题解释。"}}}],"min":20,"next":{"en":"Run-on sentences","zh":"连写句"}},{"id":"lesson4","n":4,"title":{"en":"Run-on sentences","zh":"连写句"},"goal":{"en":"I can find and fix run-on sentences.","zh":"我能找出并改正连写句。"},"short":false,"screens":[{"id":"L2-01.learn","step":"L2-01","kind":"learn","page":"L2-01.skill","title":{"en":"Learn","zh":"学一学"},"min":3,"template":"P2","params":{"body":"rule_pair","diagram":"hamburger","skip_offer":true},"coach":{"arrive":{"en":"A run-on is two sentences squashed into one, with no real stop between them. The reader runs out of breath.","zh":"连写句是两个句子挤成一句，中间没有真正的停顿，读者会喘不过气。"},"beats":[{"en":"“We planted seeds, they grew fast.” Each half could stand alone. A comma alone is not strong enough to hold them.","zh":"“We planted seeds, they grew fast.” 两半都能单独成句，只用逗号撑不住。"},{"en":"To spot one, read it out loud. Where your voice stops and a new idea starts, a new sentence starts.","zh":"要找出连写句，就读出声。声音停下、新意思开始的地方，就是新句子的开头。"},{"en":"Three fixes: a period (“…seeds. They…”), a comma plus and or so (“…seeds, and they…”), or because.","zh":"三种改法：句号；逗号加 and 或 so；或者用 because。"}]}},{"id":"L2-01.t.ro1","step":"L2-01","kind":"task","page":"L2-01.skill","task":"ro1","title":{"en":"Spot the run-on","zh":"找出连写句"},"min":2,"template":"P3","params":{"layout":"list","unit":"option","pick":"single","scored":"auto"},"coach":{"arrive":{"en":"One of these is a run-on. Look at what joins the two ideas in each one.","zh":"其中一句是连写句。看看每句用什么把两个意思连起来。"}}},{"id":"L2-01.t.ro5","step":"L2-01","kind":"task","page":"L2-01.skill","task":"ro5","title":{"en":"Find 4 run-ons","zh":"找出 4 处连写"},"min":2,"template":"P3","params":{"layout":"passage","unit":"boundary","pick":"multi","scored":"auto","targets":4,"remediation":"ro5r"},"coach":{"arrive":{"en":"Read this slowly, out loud. Each time your voice wants to stop, a new sentence should start there.","zh":"慢慢读出声。每次声音想停下的地方，都该开始一个新句子。"}}},{"id":"L2-01.t.ro3","step":"L2-01","kind":"task","page":"L2-01.skill","task":"ro3","title":{"en":"Fix a run-on","zh":"改正连写句"},"min":2,"template":"P4","par
