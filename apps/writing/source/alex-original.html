ams":{"input":"words","source":"given","action":"fix","scoring":"rule","evidence":"practice"},"coach":{"arrive":{"en":"Find where the first idea ends. Then choose your fix: a period, or a joining word.","zh":"找到第一个意思在哪里结束，再选改法：句号或连接词。"}}},{"id":"L2-01.t.ro6","step":"L2-01","kind":"task","page":"L2-01.skill","task":"ro6","title":{"en":"Join with “, so”","zh":"用 , so 连接"},"min":2,"template":"P4","params":{"action":"build","input":"set","build_unit":"phrase","order":"free","distractors":3,"scoring":"auto","evidence":"practice"},"coach":{"arrive":{"en":"“, so” joins two ideas when the second one happens because of the first.","zh":"当第二件事是因为第一件事发生的，就用 “, so” 连起来。"}}},{"id":"L2-01.t.ro7","step":"L2-01","kind":"task","page":"L2-01.skill","task":"ro7","title":{"en":"Fix it your way","zh":"用你的办法改"},"min":1,"template":"P4","params":{"input":"words","source":"given","action":"rewrite","scoring":"rule","evidence":"practice"},"coach":{"arrive":{"en":"Your choice this time. Any of the three fixes is fine, as long as both ideas stay.","zh":"这次你自己选。三种改法都可以，只要两个意思都保留。"}}},{"id":"L2-01.apply","step":"L2-01","kind":"apply","page":"L2-01.apply","title":{"en":"Try it in your own writing","zh":"在自己的写作里试一试"},"min":5,"template":"P5","params":{"purpose":"apply","phase":"draft","input":"folded","feedback":"constraint","evidence":"apply"},"coach":{"arrive":{"en":"Write about a sports day. Twice, join two ideas the right way: with a period, “, and”, “, so”, or because.","zh":"写运动会。至少两次用正确的方法连接两个意思。"}}},{"id":"L2-01.check","step":"L2-01","kind":"check","page":"L2-01.check","title":{"en":"Check","zh":"小测"},"min":3,"template":"P7","params":{"purpose":"mastery","preset":"assessment","items":"3 auto + 1 writing","pass_rule":">=2/3 auto AND writing correct","second_set":true,"input":"keyboard"},"coach":{"arrive":{"en":"Last skill check. No hints. Read each one out loud in your head. I’ll explain every answer after.","zh":"最后一个技能小测，没有提示。在心里读出声。做完我会解释每一题。"}}}],"min":20,"next":{"en":"A strong paragraph","zh":"读一篇好段落"}},{"id":"lesson5","n":5,"title":{"en":"A strong paragraph","zh":"读一篇好段落"},"goal":{"en":"I can find the parts of a strong opinion paragraph.","zh":"我能在好段落里找出各个部分。"},"short":false,"screens":[{"id":"model.read","step":"model","kind":"model_read","page":"model","title":{"en":"Read the model","zh":"读范文"},"min":6,"template":"P2","params":{"body":"annotated_text"},"coach":{"arrive":{"en":"Here are two paragraphs on the same question. Read both. One is stronger. Keep the hamburger in your head as you read.","zh":"这是两段写同一个问题的段落。两段都读，其中一段更好。读的时候想着汉堡。"},"beats":[{"en":"Look at the first sentence of Paragraph A. It answers the question and says “I think.” That is the top bun.","zh":"看 A 段第一句：它回答了问题，还用了 “I think”，这是上层面包。"},{"en":"Find “First,” and “In addition,”. Each brings a reason, and right after each reason comes something that really happened.","zh":"找 “First,” 和 “In addition,”。每个都引出一个理由，后面紧跟一件真实发生的事。"},{"en":"Now look at B. Does every reason have an example? That is the question to keep asking.","zh":"再看 B 段：每个理由都有例子吗？要一直问这个问题。"}]}},{"id":"model.t.mt.top","step":"model","kind":"model_task","page":"model","task":"mt.top","title":{"en":"Find the top bun","zh":"找出上层面包"},"min":2,"template":"P3","params":{"layout":"passage","source":"model","unit":"sentence","pick":"single","scored":"auto"},"coach":{"arrive":{"en":"Which sentence tells what the writer thinks about weekend homework?","zh":"哪一句说出了作者对周末作业的想法？"}}},{"id":"model.t.mt.detail","step":"model","kind":"model_task","page":"model","task":"mt.detail","title":{"en":"Find an example","zh":"找出一个例子"},"min":2,"template":"P3","params":{"layout":"passage","source":"model","unit":"sentence","pick":"single","scored":"auto"},"coach":{"arrive":{"en":"An example is something that really happened to someone. Find the sentences that show, not tell.","zh":"例子是某人身上真实发生的事。找出“展示”而不是“告诉”的句子。"}}},{"id":"model.t.mt.bottom","step":"model","kind":"model_task","page":"model","task":"mt.bottom","title":{"en":"Find the bottom bun","zh":"找出下层面包"},"min":2,"template":"P3","params":{"layout":"passage","source":"model","unit":"sentence","pick":"single","scored":"auto"},"coach":{"arrive":{"en":"The closing wraps it up. It says the opinion again in new words.","zh":"结尾句收尾，用新的话再说一次观点。"}}},{"id":"model.t.m1","step":"model","kind":"model_task","page":"model","task":"m1","title":{"en":"A or B?","zh":"A 还是 B？"},"min":4,"template":"P3","params":{"layout":"two_up","pick":"single","scored":"auto"},"coach":{"arrive":{"en":"Think about the hamburger. Which paragraph has every layer?","zh":"想想汉堡。哪一段每一层都有？"}}},{"id":"model.t.m2","step":"model","kind":"model_task","page":"model","task":"m2","title":{"en":"Why is it stronger?","zh":"为什么更好？"},"min":4,"template":"P3","params":{"layout":"list","pick":"multi","scored":"auto"},"coach":{"arrive":{"en":"Stronger does not mean longer. What does the stronger paragraph DO that the other one doesn’t?","zh":"更好不等于更长。更好的那段做到了什么，另一段没做到？"}}}],"min":20,"next":{"en":"Plan your paragraph","zh":"计划你的段落"}},{"id":"lesson6","n":6,"title":{"en":"Plan your paragraph","zh":"计划你的段落"},"goal":{"en":"I can plan my paragraph layer by layer.","zh":"我能一层一层地计划我的段落。"},"short":false,"screens":[{"id":"plan.topic","step":"plan","kind":"plan_topic","page":"plan","title":{"en":"Choose a question","zh":"选一个问题"},"min":3,"template":"P3","params":{"layout":"cards","pick":"single","scored":"none"},"coach":{"arrive":{"en":"Pick the question you have the most to say about. You will need two reasons and a real example for each.","zh":"选一个你最有话说的问题。你需要两个理由，每个理由配一个真实的例子。"}}},{"id":"plan.top","step":"plan","kind":"plan_layer","page":"plan","fields":["opinion"],"title":{"en":"Top bun: my opinion","zh":"上层面包：我的观点"},"min":3,"template":"P6","params":{"organizer":"hamburger","view":"layer","fields":["opinion"],"coach":"ask"},"coach":{"arrive":{"en":"Your top bun: answer the question and say what you think. Short notes are fine here.","zh":"上层面包：回答问题，说出你的想法。这里写简短笔记就行。"}}},{"id":"plan.r1","step":"plan","kind":"plan_layer","page":"plan","fields":["reason1","detail1"],"title":{"en":"Reason 1 and an example","zh":"理由 1 和例子"},"min":4,"template":"P6","params":{"organizer":"hamburger","view":"layer","fields":["reason1","detail1"],"coach":"ask"},"coach":{"arrive":{"en":"Your strongest reason first. Then a real example: something you saw, did, or know happened.","zh":"先写最有力的理由，再写一个真实例子：你看到的、做过的或知道的事。"}}},{"id":"plan.r2","step":"plan","kind":"plan_layer","page":"plan","fields":["reason2","detail2"],"title":{"en":"Reason 2 and an example","zh":"理由 2 和例子"},"min":4,"template":"P6","params":{"organizer":"hamburger","view":"layer","fields":["reason2","detail2"],"coach":"ask"},"coach":{"arrive":{"en":"A second reason has to be different from the first, not the same idea in new words. Ask: is this really new?","zh":"第二个理由要和第一个不同，不能换个说法重复。问问自己：这真的是新的吗？"}}},{"id":"plan.bottom","step":"plan","kind":"plan_layer","page":"plan","fields":["closing"],"title":{"en":"Bottom bun: closing idea","zh":"下层面包：结尾"},"min":3,"template":"P6","params":{"organizer":"hamburger","view":"layer","fields":["closing"],"coach":"ask"},"coach":{"arrive":{"en":"How will you wrap it up? Plan to say your opinion again, in new words.","zh":"你打算怎么收尾？计划用新的话再说一次观点。"}}},{"id":"plan.check","step":"plan","kind":"plan_check","page":"plan","title":{"en":"Check my plan","zh":"检查我的计划"},"min":3,"template":"P6","params":{"organizer":"hamburger","view":"whole","coach":"ask","send_to_canvas":true},"coach":{"arrive":{"en":"Read your plan from top to bottom. Does each reason have its own example? If yes, you are ready to write.","zh":"从上往下读你的计划。每个理由都有自己的例子吗？有的话就可以写了。"}}}],"min":20,"next":{"en":"Write your paragraph","zh":"写你的段落"}},{"id":"lesson7","n":7,"title":{"en":"Write your paragraph","zh":"写你的段落"},"goal":{"en":"I can write my whole paragraph from my plan.","zh":"我能按计划写出整个段落。"},"short":false,"screens":[{"id":"draft.ready","step":"draft","kind":"draft_ready","page":"draft","title":{"en":"Get ready","zh":"准备"},"min":4,"template":"P6","params":{"organizer":"hamburger","view":"recap"},"coach":{"arrive":{"en":"Your plan is your map. Each note becomes a full sentence. The linking words help you move from one layer to the next.","zh":"计划就是地图。每条笔记变成一个完整的句子，连接词帮你从一层走到下一层。"}}},{"id":"draft.write","step":"draft","kind":"draft_write","page":"draft","title":{"en":"Write","zh":"写"},"min":16,"template":"P5","params":{"purpose":"draft","phase":"draft","zones_from":"plan","input":"words","feedback":"rubric","evidence":"genre"},"coach":{"arrive":{"en":"Write it as a paragraph, top bun first. I’ll read along and point out one thing at a time while you write.","zh":"写成一个段落，先写上层面包。你写的时候我会跟着读，一次只提醒一件事。"}}}],"min":20,"next":{"en":"Read my comments and revise","zh":"读批注，改一改"}},{"id":"lesson8","n":8,"title":{"en":"Read my comments and revise","zh":"读批注，改一改"},"goal":{"en":"I can use comments and CUPS to make my paragraph better.","zh":"我能根据批注和 CUPS 改好段落。"},"short":false,"screens":[{"id":"revise.comments","step":"revise","kind":"rev_comments","page":"feedback","title":{"en":"Read my comments","zh":"读批注"},"min":8,"template":"P5","params":{"purpose":"draft","phase":"revise","input":"folded","feedback":"rubric"},"coach":{"arrive":{"en":"Good writers always make a second draft. Read my comments one at a time and fix one thing before the next.","zh":"好作者都会写第二稿。一条一条读批注，改好一处再看下一处。"}}},{"id":"revise.cups","step":"revise","kind":"rev_cups","page":"feedback","title":{"en":"Check and hand in again","zh":"检查后再交"},"min":7,"template":"P5","params":{"purpose":"draft","phase":"revise","check":"CUPS","input":"folded","feedback":"rubric"},"coach":{"arrive":{"en":"CUPS is a last check: Capitals, Usage, Punctuation, Spelling. Read slowly, one sentence at a time.","zh":"CUPS 是最后检查：大写、用法、标点、拼写。一句一句慢慢读。"}}},{"id":"revise.final","step":"revise","kind":"rev_final","page":"feedback","title":{"en":"Second look","zh":"再看一遍"},"min":5,"template":"P5","params":{"purpose":"draft","phase":"review","input":"none"},"coach":{"arrive":{"en":"Read it once more as if you were the reader. Is anything still unclear? This is your last chance to make it shine.","zh":"再当一次读者读一遍。还有不清楚的地方吗？这是最后一次让它更好的机会。"}}}],"min":20,"next":{"en":"My finished paragraph","zh":"我完成的段落"}},{"id":"lesson9","n":9,"title":{"en":"My finished paragraph","zh":"我完成的段落"},"goal":{"en":"I can share my paragraph and tell how it grew.","zh":"我能展示段落，说出它的进步。"},"short":true,"screens":[{"id":"report.paragraph","step":"report","kind":"rep_paragraph","page":"report","title":{"en":"My paragraph","zh":"我的段落"},"min":3,"template":"P1","params":{"variant":"final"},"coach":{"arrive":{"en":"This is your finished paragraph. Read it out loud once. You built every layer of it.","zh":"这是你完成的段落。大声读一遍，每一层都是你搭的。"}}},{"id":"report.grew","step":"report","kind":"rep_grew","page":"report","title":{"en":"How it grew","zh":"我的进步"},"min":3,"template":"P1","params":{"variant":"growth"},"coach":{"arrive":{"en":"Here is how your writing changed from your first draft to your final one.","zh":"这是你从初稿到定稿的变化。"}}},{"id":"report.reflect","step":"report","kind":"rep_reflect","page":"report","title":{"en":"One last thing","zh":"最后一件事"},"min":4,"template":"P4","params":{"source":"frame","action":"write","input":"keyboard","scoring":"none"},"coach":{"arrive":{"en":"One last thing: think about what you will do the same way next time you write.","zh":"最后一件事：想想下次写作时你会怎样做。"}}}],"min":10,"next":null}],"pages":[{"id":"L2-04.skill","kind":"skill","skill":"L2-04","title":"Top bun: the topic sentence","nav":"Top bun","teach":{"en":"A topic sentence tells the topic and what you think.","zh":"主题句要说出话题和你的想法。"},"tasks":["ts1","ts4","ts3","ss.L2-04","ts8"],"grid":{"level":"chunks","tabs":["opinion","nouns","marks"]},"teacher":{"ccss":["W.4.1.a"],"note":"Practice. Grid at chunks level."}},{"id":"L2-04.apply","kind":"apply","skill":"L2-04","title":"Try it: top bun","nav":"Try it","task":"L2-04.apply","grid":{"level":"words","tabs":["opinion","nouns","adjectives","marks"]},"teacher":{"ccss":["W.4.1.a","W.4.10"],"note":"Apply quick-write, AI/offline criteria check. Can move on after 2 tries. Counts as in-writing evidence."}},{"id":"L2-04.check","kind":"check","skill":"L2-04","title":"Check: top bun","nav":"Check","pool":["tq1","tq2","tq3","tq4","tq5"],"auto_per_attempt":3,"writing":"L2-04.mw","grid":{"level":"off"},"teacher":{"ccss":["W.4.1.a"],"note":"3 rotating auto items + 1 writing item, no help, no feedback until the end. Pass = 2/3 auto AND writing correct."}},{"id":"L2-05.skill","kind":"skill","skill":"L2-05","title":"The filling and the bottom bun","nav":"Filling","teach":{"en":"Every reason needs an example that shows it. Your last sentence says your opinion again, in new words.","zh":"每个理由都需要一个例子来证明。最后一句用新的说法再说一次观点。"},"tasks":["sc1","sc7","sc3","sc4","sc5"],"grid":{"level":"chunks","tabs":["linking","nouns","adjectives","marks"]},"teacher":{"ccss":["W.4.1.b","W.4.1.d"],"note":"Practice. Grid at chunks level."}},{"id":"L2-05.apply","kind":"apply","skill":"L2-05","title":"Try it: filling","nav":"Try it","task":"L2-05.apply","grid":{"level":"words","tabs":["places","senses","linking","marks"]},"teacher":{"ccss":["W.4.1.b","W.4.1.d","W.4.10"],"note":"Apply quick-write, AI/offline criteria check. Can move on after 2 tries. Counts as in-writing evidence."}},{"id":"L2-05.check","kind":"check","skill":"L2-05","title":"Check: filling","nav":"Check","pool":["sq1","sq2","sq3","sq4","sq5"],"auto_per_attempt":3,"writing":"L2-05.mw","grid":{"level":"off"},"teacher":{"ccss":["W.4.1.b","W.4.1.d"],"note":"3 rotating auto items + 1 writing item, no help, no feedback until the end. Pass = 2/3 auto AND writing correct."}},{"id":"L2-06.skill","kind":"skill","skill":"L2-06","title":"Linking words","nav":"Linking","teach":{"en":"Linking words help your reader follow you: First, For instance, In addition, because.","zh":"连接词帮读者跟上你的思路：First, For instance, In addition, because。"},"tasks":["lw1","lw6","lw3","lw5","lw4"],"grid":{"level":"chunks","tabs":["linking","marks"]},"teacher":{"ccss":["W.4.1.c"],"note":"Practice. Grid at chunks level."}},{"id":"L2-06.apply","kind":"apply","skill":"L2-06","title":"Try it: linking","nav":"Try it","task":"L2-06.apply","grid":{"level":"words","tabs":["linking","water","adjectives","marks"]},"teacher":{"ccss":["W.4.1.c","W.4.10"],"note":"Apply quick-write, AI/offline criteria check. Can move on after 2 tries. Counts as in-writing evidence."}},{"id":"L2-06.check","kind":"check","skill":"L2-06","title":"Check: linking","nav":"Check","pool":["lq1","lq2","lq3","lq4","lq5"],"auto_per_attempt":3,"writing":"L2-06.mw","grid":{"level":"off"},"teacher":{"ccss":["W.4.1.c"],"note":"3 rotating auto items + 1 writing item, no help, no feedback until the end. Pass = 2/3 auto AND writing correct."}},{"id":"L2-01.skill","kind":"skill","skill":"L2-01","title":"One idea, one sentence","nav":"Run-ons","teach":{"en":"Two ideas? Use a period, or join them with , and / , but / , so / because.","zh":"两个意思？用句号断开，或者用 , and / , but / , so / because 连接。"},"tasks":["ro1","ro5","ro3","ro6","ro7"],"grid":{"level":"words","tabs":["joining","marks"]},"teacher":{"ccss":["L.4.1.f","L.4.2.c"],"note":"Practice. Grid at words level."}},{"id":"L2-01.apply","kind":"apply","skill":"L2-01","title":"Try it: run-ons","nav":"Try it","task":"L2-01.apply","grid":{"level":"keyboard","tabs":["joining","sports","marks"]},"teacher":{"ccss":["L.4.1.f","L.4.2.c","W.4.10"],"note":"Apply quick-write, AI/offline criteria check. Can move on after 2 tries. Counts as in-writing evidence."}},{"id":"L2-01.check","kind":"check","skill":"L2-01","title":"Check: run-ons","nav":"Check","pool":["rq1","rq2","rq3","rq4","rq5"],"auto_per_attempt":3,"writing":"L2-01.mw","grid":{"level":"off"},"teacher":{"ccss":["L.4.1.f","L.4.2.c"],"note":"3 rotating auto items + 1 writing item, no help, no feedback until the end. Pass = 2/3 auto AND writing correct."}},{"id":"model","kind":"model","title":"Look at a strong paragraph","nav":"Model","teach":{"en":"Tap any sentence in Paragraph A to see my note.","zh":"点 A 段的任意一句，看看我的批注。"},"model":{"prompt":"Should kids have homework on weekends?","a":[{"text":"I think kids should not have homework on weekends.","role":"top","note":{"en":"This is the top bun. “I think” and “should” tell me the opinion right away.","zh":"这是上层面包。“I think” 和 “should” 一下子告诉我观点。"},"teacher":{"ccss":"W.4.1.a","v2_note":"Top bun: the topic sentence tells the opinion. Opinion words: \"I think\", \"should\"."}},{"text":"First, kids need time to rest.","role":"reason","note":{"en":"First reason. “First,” tells me a reason is coming.","zh":"第一个理由。“First,” 提示理由来了。"},"teacher":{"ccss":"W.4.1.a","v2_note":"Reason 1. \"First,\" is a linking word that starts the first reason."}},{"text":"For instance, my brother is so tired on Friday that he falls asleep at dinner.","role":"detail","note":{"en":"I can picture this. The example shows the reason is true.","zh":"我能想象出这个画面。这个例子证明理由是真的。"},"teacher":{"ccss":"W.4.1.b · W.4.1.c","v2_note":"Detail: \"For instance,\" brings an example that SHOWS reason 1 is true."}},{"text":"In addition, weekends are for family.","role":"reason","note":{"en":"Second reason. “In addition,” adds it.","zh":"第二个理由。“In addition,” 把它加进来。"},"teacher":{"ccss":"W.4.1.c","v2_note":"Reason 2. \"In addition,\" adds a second reason."}},{"text":"My family visits my grandma every Sunday, and we cook dumplings together.","role":"detail","note":{"en":"A real example from the writer’s life. See how “, and” joins two sentences.","zh":"来自作者生活的真实例子。注意 “, and” 正确地连接了两个句子。"},"teacher":{"ccss":"W.4.1.b · L.4.2.c","v2_note":"Detail: a real example from the writer's life. Notice \", and\" joins two sentences correctly."}},{"text":"Homework would take that time away.","role":"detail","note":{"en":"This links the example back to the opinion.","zh":"这一句把例子和观点连回来。"},"teacher":{"ccss":"W.4.1.b","v2_note":"Explains how the detail connects back to the opinion."}},{"text":"For these reasons, weekends should be homework-free.","role":"bottom","note":{"en":"Bottom bun. Same opinion, new words.","zh":"下层面包。同样的观点，新的说法。"},"teacher":{"ccss":"W.4.1.d","v2_note":"Bottom bun: the closing sentence says the opinion again in a NEW way."}}],"b":"Homework is bad. I don't like it, my friends don't like it. Weekends are fun. We play games. Also my teacher gives too much homework on Monday. That is all."},"tasks":["mt.top","mt.detail","mt.bottom","m1","m2"],"grid":{"level":"tap","tabs":[]},"teacher":{"ccss":["W.4.1.a","W.4.1.b","W.4.1.c","W.4.1.d"],"note":"Annotated model + compare with weak Paragraph B."}},{"id":"plan","kind":"plan","title":"Plan your paragraph","nav":"Plan","teach":{"en":"Notes are fine here. A few words in each part.","zh":"这里写关键词就可以，每部分几个词。"},"topics":[{"id":"garden","text":"Should our school have a garden?","pic":"🌱","final":true},{"id":"pet","text":"Should kids have a pet at home?","pic":"🐶","final":false},{"id":"city","text":"Is it better to live in a city or a village?","pic":"🏙️","final":false},{"id":"recess","text":"Should recess be longer?","pic":"⏰","final":false},{"id":"cook","text":"Should every student learn to cook?","pic":"🍳","final":false},{"id":"start","text":"Should school start later in the morning?","pic":"🌅","final":false}],"slots":[{"field":"opinion","label":"Top bun: My opinion","zh":"上层面包 · 我的观点","part":"top","ph":"Yes or no? What do you think?"},{"field":"reason1","label":"Reason 1","zh":"理由 1","part":"fill","ph":"Why? (a few words)"},{"field":"detail1","label":"Detail / example for reason 1","zh":"理由 1 的细节或例子","part":"fill","ph":"A fact or example"},{"field":"reason2","label":"Reason 2","zh":"理由 2","part":"fill","ph":"Another reason"},{"field":"detail2","label":"Detail / example for reason 2","zh":"理由 2 的细节或例子","part":"fill","ph":"A fact or example"},{"field":"closing","label":"Bottom bun: Closing idea","zh":"下层面包 · 结尾想法","part":"bottom","ph":"Say your opinion again in a new way"}],"questions":{"opinion":[{"en":"Do you think yes or no? Why does this question matter to you?","zh":"你的答案是\"是\"还是\"不是\"？这个问题对你来说为什么重要？"},{"en":"Look at the top bun. A reader wants to know: what do YOU think? Use “should” or “I think”.","zh":"看上层面包：读者想知道你怎么想。用 should 或 I think。"}],"reason1":[{"en":"Why do you think that? Think about who would be helped.","zh":"你为什么这样想？想想对谁有帮助。"},{"en":"Look at Reason 1. A reader will ask, \"Why?\" Add one word that tells who or what.","zh":"看理由 1：读者会问\"为什么？\"加一个说明\"谁\"或\"什么\"的词。"}],"detail1":[{"en":"Can you remember a time this happened, or a fact you know?","zh":"你能想起一次真实发生的事，或者一个你知道的事实吗？"},{"en":"Look at the detail for Reason 1. Add something you could SEE or COUNT.","zh":"看理由 1 的细节：加一个能看到或数出来的东西。"}],"reason2":[{"en":"What is a different reason — not the same as Reason 1?","zh":"还有什么不同的理由？不要和理由 1 一样。"},{"en":"Look at Reason 2. A reader will ask, \"Why is it good?\" Think about who would use it.","zh":"看理由 2：读者会问\"为什么好？\"想想谁会用到它。"}],"detail2":[{"en":"What example shows Reason 2 is true?","zh":"什么例子能证明理由 2？"},{"en":"Look at the detail for Reason 2. Who? Where? When?","zh":"看理由 2 的细节：谁？在哪里？什么时候？"}],"closing":[{"en":"How can you say your opinion again with new words?","zh":"怎样用新的词再说一遍你的观点？"},{"en":"Look at the bottom bun. It should match your top bun, but not copy it.","zh":"看下层面包：要和上层面包呼应，但不要照抄。"}],"duplicate":{"en":"Reason 2 sounds like Reason 1. What is a different reason?","zh":"理由 2 和理由 1 很像。还有什么不同的理由？"},"vague":{"en":"Tell me more here. Who? What exactly?","zh":"这里再多说一点：谁？具体是什么？"}},"grid":{"level":"chunks","tabs":["opinion","reasons","nouns","adjectives","pictures"]},"teacher":{"ccss":["W.4.1.a","W.4.1.b","W.4.5"],"note":"Hamburger template inside the document; plan coach questions as margin comments."}},{"id":"draft","kind":"draft","title":"Write your paragraph","nav":"Draft","teach":{"en":"Write it all in one paragraph. Use your plan. About 80 to 150 words.","zh":"写成一段，用上你的计划，大约 80 到 150 词。"},"length":[80,150],"guide":[{"part":"top","label":"Top bun","hint":{"en":"What do you think?","zh":"你怎么想？"}},{"part":"r1","label":"Reason 1 + example","hint":{"en":"Why? Show me.","zh":"为什么？举个例子。"}},{"part":"r2","label":"Reason 2 + example","hint":{"en":"Another reason. Show me.","zh":"另一个理由，举个例子。"}},{"part":"bottom","label":"Bottom bun","hint":{"en":"Say it again, new words.","zh":"换个说法再说一次。"}}],"grid":{"level":"words","tabs":["myplan","linking","opinion","nouns","adjectives","marks"]},"teacher":{"ccss":["W.4.1.a","W.4.1.b","W.4.1.c","W.4.1.d"],"note":"Final task draft. Grid at word level; analytics records grid vs typed."}},{"id":"feedback","kind":"feedback","title":"Read my comments","nav":"Revise","teach":{"en":"Change your words yourself, then hand it in again.","zh":"自己动手改一改，然后再交一次。"},"max_drafts":2,"grid":{"level":"keyboard","tabs":["myplan","linking","marks"]},"cups":[{"letter":"C","label":"Capitals","en":"Every sentence starts with a capital. \"I\" is a capital.","zh":"大写：句首大写，I 永远大写。"},{"letter":"U","label":"Usage","en":"My sentences make sense. No run-ons.","zh":"用法：句子通顺，没有连写句。"},{"letter":"P","label":"Punctuation","en":"Every sentence has an end mark. Comma after linking words.","zh":"标点：每句有句末标点，连接词后有逗号。"},{"letter":"S","label":"Spelling","en":"I checked my spelling.","zh":"拼写：检查过拼写。"}],"teacher":{"ccss":["W.4.5","L.4.1.f","L.4.2"],"note":"AI/offline rubric scoring → max 2 comments + 1 glow as margin comments; scores hidden from student."}},{"id":"report","kind":"report","title":"My finished paragraph","nav":"Finished","teach":{"en":"Here is your paragraph. Look how far you came.","zh":"这是你的段落。看看你走了多远。"},"reflection":{"en":"Exit reflection (optional): What is one thing you changed in your paragraph? Why did it make your paragraph better?","zh":"你在段落里改了哪一处？为什么这样改让段落更好？"},"teacher":{"ccss":["W.4.1.a","W.4.1.b","W.4.1.c","W.4.1.d","L.4.1.f","L.4.2.c","W.4.5"],"note":"Rubric, unit checks, in-writing evidence, provenance."}}],"tasks":[{"id":"ts1","skill":"L2-04","ask":{"en":"Which one is a good topic sentence for a school garden? Tap it.","zh":"哪一句是关于学校花园的好主题句？点它。"},"why":{"en":"A topic sentence tells the topic and what you think. “Gardens have plants” is only a fact.","zh":"主题句要有话题和你的想法。“Gardens have plants” 只是事实。"},"teacher":{"ccss":["W.4.1.a"],"origin":"authored","source_doc":true,"v2_interaction":"IT-15 mc","evidence":"practice"},"type":"pick","lines":["Gardens have plants.","Our school should have a garden for two big reasons.","I like flowers."],"answers":[1],"multi":false,"inline":false,"coach":{"hints":[{"en":"Find the sentence that says what someone thinks.","zh":"找说出某人想法的句子。"},{"en":"Look for “should”. Which sentence also says the topic, a school garden?","zh":"找 “should”。哪一句还说到了学校花园？"}],"options":[{"en":"“Gardens have plants” is a fact. Everybody agrees, so there is nothing to explain.","zh":"这是事实，大家都同意，没什么可解释的。"},{"en":"It names the topic, a school garden, and “should” tells the opinion. That is a topic sentence.","zh":"它说出话题，“should” 说出观点。"},{"en":"“I like flowers” is about you, not about a school garden. It doesn’t answer the question.","zh":"这句说的是你自己，不是学校花园，没有回答问题。"}]}},{"id":"ts4","skill":"L2-04","ask":{"en":"Tap a word that tells you this is an opinion.","zh":"点一个说明这是观点的词。"},"why":{"en":"“believe” and “should” tell me what the writer thinks.","zh":"“believe” 和 “should” 告诉我作者怎么想。"},"teacher":{"ccss":["W.4.1.a"],"origin":"authored","source_doc":false,"v2_interaction":"IT-02 tapword","evidence":"practice"},"type":"tapword","text":"I believe our class should get a pet fish.","targets":[{"at":"believe"},{"at":"should"}],"need":"one","coach":{"hints":[{"en":"Which word tells you this is what the writer thinks?","zh":"哪个词告诉你这是作者的想法？"},{"en":"There are two good ones. One is about believing. One is about what ought to happen.","zh":"有两个词。一个和“相信”有关，一个和“应该”有关。"}],"words":{"i":{"en":"“I” tells who is speaking, not what they think.","zh":"“I” 只说明是谁在说。"},"our":{"en":"“Our” tells whose class it is. It isn’t an opinion word.","zh":"“Our” 说明是谁的班级。"},"class":{"en":"“Class” is part of the topic, not the opinion.","zh":"“class” 是话题的一部分。"},"get":{"en":"“Get” is the action. Look for the word that shows what the writer thinks.","zh":"“get” 是动作。找表示想法的词。"},"a":{"en":"“A” is a tiny helper word. Look for a word with an opinion in it.","zh":"“a” 是小词。找带观点的词。"},"pet":{"en":"“Pet” is part of the topic.","zh":"“pet” 是话题的一部分。"},"fish":{"en":"“Fish” is the topic. Now find what the writer thinks about it.","zh":"“fish” 是话题。再找作者的想法。"}}}},{"id":"ts3","skill":"L2-04","ask":{"en":"Some of these tell an opinion. Some are just facts. Tap every opinion.","zh":"有的是观点，有的只是事实。点出所有观点句。"},"why":{"en":"Opinions use words like should, best, in my opinion. Facts can be checked.","zh":"观点会用 should、best、in my opinion；事实是可以查证的。"},"teacher":{"ccss":["W.4.1.a"],"origin":"authored","source_doc":false,"v2_interaction":"IT-04 sort","evidence":"practice"},"type":"pick","lines":["Dogs are the best pets for families.","Many families have dogs.","In my opinion, every kid should learn to swim.","The pool opens at 9:00.","School lunch should have more fruit.","Lunch is at noon."],"answers":[0,2,4],"multi":true,"coach":{"hints":[{"en":"For each one, ask: could I check this, or is it what someone thinks?","zh":"每句都问：能查证吗，还是某人的想法？"},{"en":"Words like should, best and in my opinion are clues. There are three opinions.","zh":"should、best、in my opinion 是线索。一共有三个观点。"}],"options":[{"en":"“The best” is what someone thinks. Other people might pick cats, so it is an opinion.","zh":"“the best” 是某人的想法，所以是观点。"},{"en":"You could count the families with dogs. That makes it a fact.","zh":"可以数一数养狗的家庭，所以是事实。"},{"en":"“In my opinion” tells you straight away. This is an opinion.","zh":"“In my opinion” 直接告诉你这是观点。"},{"en":"You can look at the sign to check the time. That is a fact.","zh":"看告示就能查到时间，是事实。"},{"en":"“Should” tells what someone wants. People could disagree, so it is an opinion.","zh":"“should” 表示某人的希望，别人可能不同意，所以是观点。"},{"en":"You can check the timetable. Lunch at noon is a fact.","zh":"可以查时间表，是事实。"}]}},{"id":"ss.L2-04","skill":"L2-04","type":"build","set":"sentence","in_order":true,"ask":{"en":"Build this topic sentence with the grid, one word at a time: “Our school should have a garden for two big reasons.”","zh":"用下面的词格一个一个拼出这个主题句。"},"cells":["our","school","should","have","a","garden","for","two","big","reasons","."],"target":["our","school","should","have","a","garden","for","two","big","reasons","."],"answer_text":"Our school should have a garden for two big reasons.","why":{"en":"Read it out loud with me. Which word comes next?","zh":"跟我一起读一遍。下一个词是什么？"},"ok":{"en":"That’s it. The topic is a garden, and “should” tells what you think.","zh":"对了。话题是花园，“should” 说出了你的想法。"},"teacher":{"ccss":["W.4.1.a"],"origin":"authored_v3","source_doc":true,"v2_interaction":"Clicker Sentence Set (new)","evidence":"practice"},"coach":{"hints":[{"en":"Start with who: “Our school”. Then what should happen.","zh":"先说谁：“Our school”，再说应该怎样。"},{"en":"After “should have a garden” comes the promise: how many reasons?","zh":"“should have a garden” 后面是承诺：有几个理由？"}],"diagnose":["order"]}},{"id":"ts8","skill":"L2-04","ask":{"en":"Finish my sentence about recess. Fill each ___.","zh":"把关于课间的句子写完，填上每个 ___。"},"why":{"en":"Tell what recess should be, then give a real reason after \"because.\"","zh":"说出课间应该怎样，然后在 because 后面写一个真正的理由。"},"ok":{"en":"Yes. I know what you think, and why.","zh":"对。我知道你的想法和理由了。"},"teacher":{"ccss":["W.4.1.a"],"origin":"authored","source_doc":false,"v2_interaction":"IT-13 frame","evidence":"practice"},"type":"write","cells":[{"t":"be longer"},{"t":"stay the same"},{"t":"because"},{"t":"kids need"},{"t":"time to run"},{"t":"and play"},{"t":"to rest their brains"}],"frameFill":{"frame":"In my opinion, recess should ___ because ___.","blanks":[{"label":"be longer / stay the same …","min_words":2},{"label":"your reason","min_words":3}],"vagueLast":true},"start":"In my opinion, recess should ___ because ___.","grid":{"tabs":["task","opinion","marks"]},"coach":{"hints":[{"en":"First choose what recess should be.","zh":"先选课间应该怎样。"},{"en":"After “because,” put a reason that tells why kids need it.","zh":"在 because 后面写孩子为什么需要它。"}],"diagnose":["blank","no_reason"]}},{"id":"sc1","skill":"L2-05","ask":{"en":"Reason: “Recess should be longer because kids need to move.” Which detail shows it? Tap it.","zh":"理由：课间应该更长，因为孩子们需要活动。哪个细节能证明它？"},"why":{"en":"This one shows me what happens after you run. That proves the reason.","zh":"这一句让我看到跑完之后发生了什么，证明了理由。"},"teacher":{"ccss":["W.4.1.b","W.4.1.d"],"origin":"authored","source_doc":false,"v2_interaction":"IT-01 mc","evidence":"practice"},"type":"pick","lines":["Recess is outside.","For example, after I run at recess, I can sit still and listen in class.","I like math."],"answers":[1],"multi":false,"inline":false,"coach":{"hints":[{"en":"Which sentence is about moving at recess?","zh":"哪一句和课间活动有关？"},{"en":"Look for “For example,”. Does it show what happens after kids move?","zh":"找 “For example,”。它展示了活动以后会怎样吗？"}],"options":[{"en":"“Recess is outside” is true, but it doesn’t show why kids need to move.","zh":"这是真的，但没说明孩子为什么需要活动。"},{"en":"It shows what really happens after running: you can sit still and listen. That proves the reason.","zh":"它展示了跑完以后真实发生的事，证明了理由。"},{"en":"Math has nothing to do with this reason. It is off topic.","zh":"数学和这个理由无关，跑题了。"}]}},{"id":"sc7","skill":"L2-05","ask":{"en":"One sentence in this paragraph is off topic. Tap it.","zh":"这段里有一句离题了，点它。"},"why":{"en":"Where your cousin lives has nothing to do with pets.","zh":"表哥住在哪里和宠物无关。"},"teacher":{"ccss":["W.4.1.b","W.4.1.d"],"origin":"authored","source_doc":false,"v2_interaction":"IT-06 highlight","evidence":"practice"},"type":"pick","lines":["I think kids should have a pet.","Pets teach us to be responsible.","For example, I feed my cat every morning.","My cousin lives in Canada.","Pets are also good friends.","For these reasons, every kid should have a pet."],"answers":[3],"multi":false,"inline":true,"coach":{"hints":[{"en":"Every sentence should be about pets. Check each one.","zh":"每一句都该和宠物有关，一句一句看。"},{"en":"One sentence is about a person and a place, not a pet.","zh":"有一句说的是一个人和一个地方，不是宠物。"}],"options":[{"en":"This is the topic sentence. It sets up the whole paragraph about pets.","zh":"这是主题句，引出整段宠物的内容。"},{"en":"This is a reason about pets. It belongs.","zh":"这是关于宠物的理由，应该保留。"},{"en":"This example shows the reason about being responsible. It belongs.","zh":"这个例子展示了“负责任”这个理由，应该保留。"},{"en":"Where your cousin lives has nothing to do with pets. That one is off topic.","zh":"表哥住哪儿和宠物无关，跑题了。"},{"en":"This is a second reason about pets. It belongs.","zh":"这是第二个关于宠物的理由。"},{"en":"This is the closing. It says the opinion again.","zh":"这是结尾句，再说一次观点。"}]}},{"id":"sc3","skill":"L2-05","ask":{"en":"Build the hamburger paragraph. Tap the sentences in order.","zh":"按顺序点句子，拼成一个汉堡包段落。"},"why":{"en":"Start with the opinion. Then a reason and its example, the next reason, and the closing.","zh":"先写观点，再写理由和例子、第二个理由，最后结尾。"},"teacher":{"ccss":["W.4.1.b","W.4.1.d"],"origin":"authored","source_doc":false,"v2_interaction":"IT-05 order","evidence":"practice"},"type":"build","set":"connect","in_order":false,"cells":["I think every kid should have a pet.","First, pets teach us to be responsible.","For example, I feed my cat every morning before school.","In addition, pets are good friends.","For these reasons, a pet is great for every kid."],"target":["I think every kid should have a pet.","First, pets teach us to be responsible.","For example, I feed my cat every morning before school.","In addition, pets are good friends.","For these reasons, a pet is great for every kid."],"answer_text":"I think every kid should have a pet. First, pets teach us to be responsible. For example, I feed my cat every morning before school. In addition, pets are good friends. For these reasons, a pet is great for every kid.","coach":{"hints":[{"en":"Which sentence tells the opinion? That one goes first.","zh":"哪句说观点？它放第一。"},{"en":"After “First,” comes its example. “For these reasons” goes last.","zh":"“First,” 后面是它的例子，“For these reasons” 放最后。"}],"diagnose":["order"]}},{"id":"sc4","skill":"L2-05","ask":{"en":"My reason is “A garden helps us learn.” Show me. What could we learn?","zh":"我的理由是“花园帮助我们学习”。展示给我看：我们能学到什么？"},"why":{"en":"Add a specific detail: what we could see, grow, or measure.","zh":"加一个具体细节：我们能看到、种出或测量什么。"},"ok":{"en":"Yes. Now I can picture it.","zh":"对，现在我能想象出来了。"},"teacher":{"ccss":["W.4.1.b","W.4.1.d"],"origin":"authored","source_doc":true,"v2_interaction":"IT-11 produce","evidence":"practice"},"type":"write","cells":[{"t":"For example,"},{"t":"we can see"},{"t":"how seeds grow"},{"t":"we can measure"},{"t":"the bean plants"},{"t":"every week"},{"t":"in science class"}],"rules":{"minWords":6,"minWordsMsg":"Tell me more. What exactly could we learn in a garden?","minWordsZh":"不错的开头！再具体些：在花园里到底能学到什么？（例如：种子怎么长大）","notVague":true,"stripRe":"^(for example|for instance),?\\s*","vagueMsg":"\"It is good\" does not tell us how. Try a detail: What could we learn in a garden? (Example: how seeds grow)","vagueZh":"\"It is good\" 没有说清楚怎么帮助学习。试着写一个细节：在花园里能学到什么？"},"given":"A garden helps us learn.","grid":{"tabs":["task","nouns","adjectives","marks"]},"coach":{"hints":[{"en":"Think of something you could see in a garden.","zh":"想想在花园里能看到什么。"},{"en":"Try: “For example, we can see how…” or “we can measure…”.","zh":"试试：“For example, we can see how…” 或 “we can measure…”。"}],"diagnose":["blank","too_short","capital","end_punct"]}},{"id":"sc5","skill":"L2-05","ask":{"en":"My topic sentence: “I think kids should learn to cook.” Which closing says it in new words?","zh":"主题句：我认为孩子应该学做饭。哪个结尾句换了新说法？"},"why":{"en":"The closing says the same opinion, but in new words. The first one just copies.","zh":"结尾句说同样的观点，但用新的说法；第一个只是照抄。"},"teacher":{"ccss":["W.4.1.b","W.4.1.d"],"origin":"authored","source_doc":false,"v2_interaction":"IT-01 mc","evidence":"practice"},"type":"pick","lines":["I think kids should learn to cook.","That is why cooking is an important skill for every kid.","I like pizza."],"answers":[1],"multi":false,"inline":false,"coach":{"hints":[{"en":"The closing says the same opinion as the topic sentence.","zh":"结尾句说的观点和主题句一样。"},{"en":"Watch out: one choice just copies the topic sentence word for word.","zh":"注意：有一个选项一字不差地照抄主题句。"}],"options":[{"en":"This copies the topic sentence word for word. A closing says it in new words.","zh":"这句照抄了主题句。结尾句要用新的话。"},{"en":"Same opinion, new words, and “That is why” wraps it up. A strong closing.","zh":"同一个观点、新的说法，“That is why” 收尾。"},{"en":"Pizza is a new topic. A closing should never bring in something new.","zh":"披萨是新话题，结尾句不能引入新内容。"}]}},{"id":"lw1","skill":"L2-06","ask":{"en":"Fill the gap. Tap a linking word in the grid.","zh":"填空：在词格里点一个连接词。"},"why":{"en":"Growing vegetables is an example of how gardens help health. So: “For instance,”.","zh":"种蔬菜是花园有益健康的一个例子，所以用 “For instance,”。"},"teacher":{"ccss":["W.4.1.c"],"origin":"authored","source_doc":true,"v2_interaction":"IT-08 fill","evidence":"practice"},"type":"edit","cloze":true,"text":"Gardens are good for health. ___ we can grow vegetables for lunch.","cells":[{"t":"For instance,"},{"t":"In addition,"},{"t":"Because"}],"accept":["Gardens are good for health. For instance, we can grow vegetables for lunch."],"grid":{"tabs":["task"]},"coach":{"hints":[{"en":"Is growing vegetables an example of being healthy, or a new reason?","zh":"种蔬菜是健康的例子，还是新理由？"},{"en":"It is an example. Which words bring in an example?","zh":"它是例子。哪个词引出例子？"}],"diagnose":["blank","link_choice"]}},{"id":"lw6","skill":"L2-06","ask":{"en":"One mark is missing. Fix the sentence right here.","zh":"少了一个标点，直接在这里改。"},"why":{"en":"“For instance” at the start needs a comma after it.","zh":"句首的 “For instance” 后面要有逗号。"},"teacher":{"ccss":["W.4.1.c"],"origin":"authored","source_doc":false,"v2_interaction":"IT-03 tapfix","evidence":"practice"},"type":"edit","text":"For instance we can plant tomatoes.","accept":["For instance, we can plant tomatoes."],"grid":{"tabs":["marks"]},"coach":{"hints":[{"en":"The mark goes near the start.","zh":"标点在句子开头附近。"},{"en":"Right after “For instance”, there should be a small pause mark.","zh":"“For instance” 后面要有一个停顿符号。"}],"diagnose":["unchanged","comma_after_link"]}},{"id":"lw3","skill":"L2-06","ask":{"en":"Tap every linking word that brings in an example.","zh":"点出所有用来举例的连接词。"},"why":{"en":"“for instance” and “for example” bring in an example. The others add a reason or tell why.","zh":"“for instance” 和 “for example” 用来举例，其他的是补充理由或说原因。"},"teacher":{"ccss":["W.4.1.c"],"origin":"authored","source_doc":false,"v2_interaction":"IT-04 sort","evidence":"practice"},"type":"pick","lines":["also","in addition","for instance","for example","because","in order to"],"answers":[2,3],"multi":true,"coach":{"hints":[{"en":"Ask: does this word make you expect an example?","zh":"问问：这个词会让你期待一个例子吗？"},{"en":"Two of them do. Both start with “for”.","zh":"有两个，都以 for 开头。"}],"options":[{"en":"“Also” adds one more thing, like another reason. It doesn’t bring an example.","zh":"“also” 是再加一件事，不是例子。"},{"en":"“In addition” adds another reason, not an example.","zh":"“in addition” 加的是另一个理由。"},{"en":"“For instance” tells me an example is coming. Yes.","zh":"“for instance” 表示例子来了。"},{"en":"“For example” is the clearest example signpost there is.","zh":"“for example” 是最清楚的例子路标。"},{"en":"“Because” gives a reason, the why. It isn’t an example word.","zh":"“because” 给出原因，不是例子词。"},{"en":"“In order to” tells the purpose. It isn’t an example word.","zh":"“in order to” 说明目的。"}]}},{"id":"lw5","skill":"L2-06","ask":{"en":"Join these with “In addition,”. Change them right here.","zh":"用 “In addition,” 把它们连起来，直接在这里改。"},"why":{"en":"Try: [first sentence]. In addition, [second idea].","zh":"试试：第一句。In addition, 第二个想法。"},"ok":{"en":"Yes. “In addition,” tells me a second reason is coming.","zh":"对。“In addition,” 告诉我第二个理由来了。"},"teacher":{"ccss":["W.4.1.c"],"origin":"authored","source_doc":true,"v2_interaction":"IT-10 produce","evidence":"practice"},"type":"edit","text":"A garden is fun. It helps the bees.","rules":{"mustInclude":[{"re":"in addition","msg":"Use the linking words \"in addition.\"","zh":"要用上 \"in addition\"。"},{"re":"fun","msg":"Keep both ideas: the garden is fun.","zh":"保留两个意思：花园很有趣。"},{"re":"bee","msg":"Keep both ideas: it helps the bees.","zh":"保留两个意思：它能帮助蜜蜂。"}],"mustNotMatch":[{"re":"(^|[.!?]\\s+)in addition\\s+(?!to\\b)","msg":"Put a comma after \"In addition\" when it starts a sentence: \"In addition, ...\"","zh":"\"In addition\" 放在句首时后面要加逗号。"}],"capital":true,"endPunct":true},"cells":[{"t":"In addition,"}],"grid":{"tabs":["task","marks"]},"coach":{"hints":[{"en":"Keep both sentences. Put the linking words at the start of the second one.","zh":"两句都保留，把连接词放在第二句开头。"},{"en":"“A garden is fun. In addition, it helps the bees.” Don’t forget the comma.","zh":"“A garden is fun. In addition, it helps the bees.” 别忘了逗号。"}],"diagnose":["unchanged","missing_link","comma_after_link","capital"]}},{"id":"lw4","skill":"L2-06","ask":{"en":"Build the sentence. Which words tell why we walk?","zh":"拼出这个句子：哪些词说明我们为什么走路？"},"why":{"en":"“in order to” tells the purpose: why we walk.","zh":"“in order to” 说明目的：我们为什么走路。"},"ok":{"en":"Yes. “in order to” tells me why.","zh":"对。“in order to” 告诉我为什么。"},"teacher":{"ccss":["W.4.1.c"],"origin":"authored","source_doc":false,"v2_interaction":"IT-08 fill","evidence":"practice"},"type":"build","set":"connect","in_order":false,"cells":["We walk to school","in order to","get exercise","."],"distractors":["for instance","in addition"],"target":["We walk to school","in order to","get exercise","."],"answer_text":"We walk to school in order to get exercise.","coach":{"hints":[{"en":"Start with what we do: “We walk to school”.","zh":"先说我们做什么：“We walk to school”。"},{"en":"Then the purpose words, then what we get from it.","zh":"然后是表示目的的词，再说我们得到什么。"}],"diagnose":["order"]}},{"id":"ro1","skill":"L2-01","ask":{"en":"Which one is a run-on? Tap it.","zh":"哪一句是连写句？点它。"},"why":{"en":"Two whole sentences joined by just a comma make a run-on.","zh":"两个完整的句子只用逗号连起来，就是连写句。"},"teacher":{"ccss":["L.4.1.f","L.4.2.c"],"origin":"authored","source_doc":false,"v2_interaction":"IT-01 mc","evidence":"practice"},"type":"pick","lines":["We planted seeds, they grew fast.","We planted seeds, and they grew fast.","We planted seeds. They grew fast."],"answers":[0],"multi":false,"inline":false,"coach":{"hints":[{"en":"In each one, look at what sits between the two ideas.","zh":"每一句都看看两个意思中间是什么。"},{"en":"One has only a comma between two whole sentences.","zh":"有一句两个完整句子之间只有一个逗号。"}],"options":[{"en":"Two whole sentences, held together by only a comma. That is a run-on.","zh":"两个完整句子只用逗号连着，是连写句。"},{"en":"The comma has “and” with it. Comma plus and is a correct join.","zh":"逗号加 and 是正确的连接。"},{"en":"A period splits the two ideas. Two clear sentences, no run-on.","zh":"句号把两个意思分开，不是连写句。"}]}},{"id":"ro5","skill":"L2-01","ask":{"en":"This paragraph has 4 run-ons. Tap the word where each new sentence should start.","zh":"这段有 4 个连写句。点出每个新句子应该开始的词。"},"why":{"en":"Read it out loud. Where does your voice stop?","zh":"读出声。你的声音在哪里停下？"},"teacher":{"ccss":["L.4.1.f","L.4.2.c"],"origin":"authored","source_doc":true,"v2_interaction":"IT-07 passage","evidence":"practice"},"type":"tapword","text":"We planted seeds, they grew fast. My friend watered them every day we were proud of our plants. The tomatoes turned red, we picked them in June. Our teacher made a salad it was delicious.","targets":[{"at":"they","occurrence":1},{"at":"we","occurrence":2},{"at":"we","occurrence":3},{"at":"it","occurrence":1}],"need":"all","remediation":"ro5r","coach":{"hints":[{"en":"Read the first sentence out loud. Where does your voice want to stop?","zh":"读第一句，声音想在哪里停？"},{"en":"Look for words like “they”, “we” and “it” that start a new idea.","zh":"找 they、we、it 这样开始新意思的词。"}],"miss":{"en":"A new sentence doesn’t start there. Read the words around it out loud. Is it still the same idea?","zh":"新句子不是从这里开始。把周围的词读出来，还是同一个意思吗？"}}},{"id":"ro5r","skill":"L2-01","ask":{"en":"Quick help first. Tap the two run-ons.","zh":"先做个小练习：点出两个连写句。"},"why":{"en":"Each run-on has two ideas with no real break between them.","zh":"每个连写句都有两个意思，中间没有真正断开。"},"teacher":{"ccss":["L.4.1.f","L.4.2.c"],"origin":"authored","source_doc":false,"v2_interaction":"IT-04 sort","evidence":"remediation"},"type":"pick","lines":["The bees buzzed, they liked the flowers.","The bees buzzed around the flowers.","We ate lunch we went outside."],"answers":[0,2],"multi":true,"coach":{"hints":[{"en":"Each run-on has two ideas with no real stop.","zh":"每个连写句都有两个意思，中间没有真正的停顿。"},{"en":"One uses only a comma. One has no mark at all.","zh":"一个只用逗号，一个什么都没有。"}],"options":[{"en":"“The bees buzzed” and “they liked the flowers” are two sentences joined by a comma. Run-on.","zh":"两个句子只用逗号连接，是连写句。"},{"en":"This is one idea in one sentence. It is fine.","zh":"一个句子一个意思，没问题。"},{"en":"“We ate lunch” and “we went outside” are squashed together with nothing between. Run-on.","zh":"两个句子挤在一起，中间什么都没有，是连写句。"}]}},{"id":"ro3","skill":"L2-01","ask":{"en":"Fix this run-on right here. Use a period, or a joining word.","zh":"直接在这里改这个连写句：用句号，或用连接词。"},"why":{"en":"End the first sentence with a period and start the next with a capital: \"...learn. We can see...\" (Using \"because\" also works.)","zh":"第一句用句号结束，下一句大写开头（用 because 也可以）。"},"ok":{"en":"Fixed. Two clear ideas.","zh":"改好了，两个意思很清楚。"},"teacher":{"ccss":["L.4.1.f","L.4.2.c"],"origin":"authored","source_doc":true,"v2_interaction":"IT-03 tapfix","evidence":"practice"},"type":"edit","text":"A garden helps us learn, we can see how seeds grow.","rules":{"noRunOn":true,"mustInclude":[{"re":"learn","msg":"Keep both ideas.","zh":"两个意思都要保留。"},{"re":"seeds","msg":"Keep both ideas.","zh":"两个意思都要保留。"}],"capital":true,"endPunct":true},"grid":{"tabs":["joining","marks"]},"coach":{"hints":[{"en":"The first idea ends after “learn”.","zh":"第一个意思在 learn 后面结束。"},{"en":"Change the comma to a period and make “we” a capital: “learn. We…”.","zh":"把逗号改成句号，we 大写：“learn. We…”。"}],"diagnose":["unchanged","run_on","capital","end_punct"]}},{"id":"ro6","skill":"L2-01","ask":{"en":"Join the two ideas with “, so”. Build it with the grid.","zh":"用 “, so” 把两个意思连起来，用词格拼出来。"},"why":{"en":"Comma, then “so”, then the second idea. One sentence.","zh":"逗号，然后 so，再接第二个意思，变成一句话。"},"ok":{"en":"That’s it. The comma comes before “so”.","zh":"对了。逗号放在 so 前面。"},"teacher":{"ccss":["L.4.1.f","L.4.2.c"],"origin":"authored","source_doc":false,"v2_interaction":"IT-10 produce","evidence":"practice"},"type":"build","set":"connect","in_order":false,"cells":["It was cold",", so","we wore our coats","."],"distractors":["It was cold.","We wore our coats.","because"],"target":["It was cold",", so","we wore our coats","."],"answer_text":"It was cold, so we wore our coats.","coach":{"hints":[{"en":"First the cold. Then what we did about it.","zh":"先说冷，再说我们怎么做。"},{"en":"“, so” goes in the middle, between the two ideas.","zh":"“, so” 放在两个意思中间。"}],"diagnose":["order"]}},{"id":"ro7","skill":"L2-01","ask":{"en":"Fix this run-on any way you like.","zh":"用你喜欢的方法改正这个连写句。"},"why":{"en":"Use a period, a comma + and/so, or because.","zh":"用句号、逗号 + and/so，或 because。"},"ok":{"en":"Fixed. Two clear ideas now.","zh":"改好了！"},"teacher":{"ccss":["L.4.1.f","L.4.2.c"],"origin":"authored","source_doc":false,"v2_interaction":"IT-12 produce","evidence":"practice"},"type":"edit","text":"We went to the park, it was sunny.","rules":{"mustInclude":[{"re":"park","msg":"Keep both ideas: the park.","zh":"保留两个意思：公园。"},{"re":"sunny","msg":"Keep both ideas: it was sunny.","zh":"保留两个意思：天气晴朗。"},{"re":"(park\\.\\s+[A-Z]|,\\s*(and|so|but)\\b|\\bbecause\\b|\\bwhen\\b|park\\s*!|sunny\\.\\s+[A-Z])","msg":"Join with a period, a comma + and/so, or because/when.","zh":"用句号、逗号 + and/so，或 because/when 来连接。"}],"capital":true,"endPunct":true,"noRunOn":true},"grid":{"tabs":["joining","marks"]},"coach":{"hints":[{"en":"Where does “We went to the park” end?","zh":"“We went to the park” 在哪里结束？"},{"en":"Try a period, or “, and”, or “because”.","zh":"试试句号、“, and” 或 because。"}],"diagnose":["unchanged","run_on","capital","end_punct"]}},{"id":"L2-04.apply","skill":"L2-04","ask":{"en":"Write 3 different topic sentences for: “Should our school have a garden?” Put each one on a new line.","zh":"为“我们学校应该有花园吗？”写 3 个不同的主题句，每句另起一行。"},"teacher":{"ccss":["W.4.1.a","W.4.10"],"origin":"authored","source_doc":true,"v2_interaction":"IT-17 apply_page","evidence":"apply"},"type":"write","apply":true,"criteria":["Three topic sentences","Each one tells an opinion (think / believe / should)","Each one is about a school garden","The three sentences are different"],"tip":{"en":"Write each sentence on a new line.","zh":""},"continue_after":2,"coach":{"hints":[{"en":"Each line needs the garden and an opinion word.","zh":"每一行都要有花园和观点词。"},{"en":"Try starting one with “I think”, one with “Our school should”, and one with “The best”.","zh":"试试用 I think、Our school should、The best 开头。"}]}},{"id":"L2-05.apply","skill":"L2-05","ask":{"en":"Write about 5 sentences about your favorite place. Start with a topic sentence and end with a closing.","zh":"写大约 5 句话介绍你最喜欢的地方。第一句是主题句，最后一句是结尾句。"},"teacher":{"ccss":["W.4.1.b","W.4.1.d","W.4.10"],"origin":"authored","source_doc":true,"v2_interaction":"IT-17 apply_page","evidence":"apply"},"type":"write","apply":true,"criteria":["About 5 sentences","First sentence is a topic sentence (place + your point)","Middle sentences give details","Last sentence closes by saying the point again in a new way"],"tip":{"en":"Topic sentence → 3 detail sentences → closing sentence.","zh":""},"continue_after":2,"coach":{"hints":[{"en":"Start with what you think about the place.","zh":"先说你对这个地方的看法。"},{"en":"Give one reason, then show it with something that happens there.","zh":"给一个理由，再用那里发生的事展示它。"}]}},{"id":"L2-06.apply","skill":"L2-06","ask":{"en":"Why should kids drink water? Use “For instance,” and “In addition,”.","zh":"孩子为什么要喝水？用上 “For instance,” 和 “In addition,”。"},"teacher":{"ccss":["W.4.1.c","W.4.10"],"origin":"authored","source_doc":true,"v2_interaction":"IT-17 apply_page","evidence":"apply"},"type":"write","apply":true,"criteria":["Uses \"for instance\"","Uses \"in addition\"","Comma after the linking word at the start of a sentence","Explains why kids should drink water"],"tip":{"en":"3–5 sentences are enough.","zh":""},"continue_after":2,"coach":{"hints":[{"en":"Give your first reason, then an example that starts with “For instance,”.","zh":"先给第一个理由，再用 “For instance,” 举例。"},{"en":"Start your second reason with “In addition,”.","zh":"第二个理由用 “In addition,” 开头。"}]}},{"id":"L2-01.apply","skill":"L2-01","ask":{"en":"Write 4 sentences about a sports day. Join two ideas the right way at least twice.","zh":"写 4 句话讲运动会，至少两次把两个意思正确地连起来。"},"teacher":{"ccss":["L.4.1.f","L.4.2.c","W.4.10"],"origin":"authored","source_doc":true,"v2_interaction":"IT-17 apply_page","evidence":"apply"},"type":"write","apply":true,"criteria":["At least 4 sentences","Two ideas joined correctly at least twice (, and / , but / , so / because / when)","No run-ons or comma splices","Comma before and / but / so when joining two sentences"],"tip":{"en":"Use , and / , but / , so / because / when.","zh":""},"continue_after":2,"coach":{"hints":[{"en":"Write two ideas about the day, then join them.","zh":"写两个关于那天的意思，再把它们连起来。"},{"en":"Use “, and” or “, so” between two ideas, or put a period.","zh":"在两个意思之间用 “, and” “, so” 或句号。"}]}},{"id":"tq1","skill":"L2-04","ask":{"en":"Question: Should every student learn to cook? Best topic sentence?","zh":"题目：每个学生都该学做饭吗？最好的主题句？"},"why":{"en":"It answers the question and tells an opinion.","zh":"它回答了题目并表达了观点。"},"teacher":{"ccss":["W.4.1.a"],"origin":"authored","source_doc":false,"v2_interaction":"IT-01 mc","evidence":"mastery"},"type":"pick","lines":["Cooking uses pots and pans.","I believe every student should learn to cook.","My mom cooks rice."],"answers":[1],"multi":false,"inline":false,"coach":{"options":[{"en":"Pots and pans are a fact about cooking. It doesn’t say what you think.","zh":"这是关于做饭的事实，没有说想法。"},{"en":"It answers the question and “I believe … should” tells the opinion.","zh":"它回答了问题，“I believe … should” 说出观点。"},{"en":"This is about your mom, not about every student. It doesn’t answer the question.","zh":"这是关于妈妈的，没有回答问题。"}]}},{"id":"tq2","skill":"L2-04","ask":{"en":"Which sentence is a FACT, not an opinion?","zh":"哪句是事实，不是观点？"},"why":{"en":"You can count students, so it is a fact.","zh":"学生人数可以数出来，所以是事实。"},"teacher":{"ccss":["W.4.1.a"],"origin":"authored","source_doc":false,"v2_interaction":"IT-01 mc","evidence":"mastery"},"type":"pick","lines":["Soccer is the best sport.","Kids should play outside more.","Our school has 300 students."],"answers":[2],"multi":false,"inline":false,"coach":{"options":[{"en":"“The best” is what someone thinks. That makes it an opinion.","zh":"“the best” 是想法，是观点。"},{"en":"“Should” tells what someone wants. It is an opinion.","zh":"“should” 表示希望，是观点。"},{"en":"You could count the students. That is a fact.","zh":"学生可以数，是事实。"}]}},{"id":"tq4","skill":"L2-04","ask":{"en":"Question: Is it better to live in a city or a village? Which topic sentence matches?","zh":"题目：住在城市好还是村庄好？哪个主题句回应了题目？"},"why":{"en":"It answers the question with an opinion.","zh":"它用观点回答了题目。"},"teacher":{"ccss":["W.4.1.a"],"origin":"authored","source_doc":false,"v2_interaction":"IT-01 mc","evidence":"mastery"},"type":"pick","lines":["I think living in a village is better than living in a city.","Cities have tall buildings.","My cousin visited Tokyo."],"answers":[0],"multi":false,"inline":false,"coach":{"options":[{"en":"It answers the city or village question and “I think” tells the opinion.","zh":"它回答了问题，“I think” 说出观点。"},{"en":"Tall buildings are a fact. It doesn’t say which is better.","zh":"高楼是事实，没说哪个更好。"},{"en":"This is about your cousin’s trip. It doesn’t answer the question.","zh":"这是表哥的旅行，没有回答问题。"}]}},{"id":"tq5","skill":"L2-04","ask":{"en":"Which topic sentence is TOO NARROW (too small) for a whole paragraph?","zh":"哪个主题句太窄，撑不起一整段？"},"why":{"en":"\"My shoe is blue\" is one small fact. There is nothing more to explain.","zh":"\"我的鞋是蓝色的\" 只是一个小事实，没什么可以展开的。"},"teacher":{"ccss":["W.4.1.a"],"origin":"authored","source_doc":false,"v2_interaction":"IT-01 mc","evidence":"mastery"},"type":"pick","lines":["I think our school should start later in the morning.","My shoe is blue.","Kids should have a pet at home."],"answers":[1],"multi":false,"inline":false,"coach":{"options":[{"en":"This one is big enough: you could give reasons why school should start later.","zh":"这句够大，可以给出理由。"},{"en":"“My shoe is blue” is one small fact. There is nothing more to explain, so it is too narrow.","zh":"一个小事实，没有可解释的，太窄。"},{"en":"You could write a whole paragraph of reasons for this one.","zh":"这句可以写一整段理由。"}]}},{"id":"sq1","skill":"L2-05","ask":{"en":"Reason: \"Kids should drink more water.\" Which detail supports it?","zh":"理由：\"孩子应该多喝水。\" 哪个细节支持它？"},"why":{"en":"It shows why water is good for kids.","zh":"它说明了喝水对孩子的好处。"},"teacher":{"ccss":["W.4.1.b","W.4.1.d"],"origin":"authored","source_doc":false,"v2_interaction":"IT-01 mc","evidence":"mastery"},"type":"pick","lines":["Water is clear.","For instance, water helps your brain stay sharp in class.","Juice comes in boxes."],"answers":[1],"multi":false,"inline":false,"coach":{"options":[{"en":"“Water is clear” is true, but it doesn’t show why kids should drink more.","zh":"是真的，但没说明为什么要多喝。"},{"en":"It shows what water does for kids in class. That supports the reason.","zh":"它展示了水对孩子的作用，支持理由。"},{"en":"Juice boxes are off topic. The reason is about water.","zh":"果汁盒跑题了。"}]}},{"id":"sq3","skill":"L2-05","ask":{"en":"Which is the best CLOSING sentence for a paragraph about longer recess?","zh":"关于延长课间的段落，哪句是最好的结尾句？"},"why":{"en":"It says the opinion again and wraps up.","zh":"它再次说出观点并收尾。"},"teacher":{"ccss":["W.4.1.b","W.4.1.d"],"origin":"authored","source_doc":false,"v2_interaction":"IT-01 mc","evidence":"mastery"},"type":"pick","lines":["For these reasons, recess should be longer.","Recess is fun.","The end."],"answers":[0],"multi":false,"inline":false,"coach":{"options":[{"en":"“For these reasons,” plus the opinion again. A real closing.","zh":"“For these reasons,” 加再次说观点，是结尾句。"},{"en":"“Recess is fun” is a new idea, and it doesn’t say the opinion again.","zh":"这是新想法，没有再说观点。"},{"en":"“The end” is for stories. A paragraph closes by saying the opinion again.","zh":"“The end” 是故事用的。"}]}},{"id":"sq5","skill":"L2-05","ask":{"en":"What does a closing sentence do?","zh":"结尾句的作用是什么？"},"why":{"en":"The bottom bun wraps up by restating the opinion.","zh":"下层面包用新的说法重申观点来收尾。"},"teacher":{"ccss":["W.4.1.b","W.4.1.d"],"origin":"authored","source_doc":false,"v2_interaction":"IT-01 mc","evidence":"mastery"},"type":"pick","lines":["It adds a brand-new reason.","It says the opinion again in a new way.","It asks the reader a question about something else."],"answers":[1],"multi":false,"inline":false,"coach":{"options":[{"en":"A closing never brings a brand-new reason. New reasons belong in the middle.","zh":"结尾不加新理由，新理由放中间。"},{"en":"Yes. The bottom bun says the opinion again in a new way.","zh":"对，下层面包用新方式再说观点。"},{"en":"A question about something else would take the reader off topic.","zh":"问别的问题会让读者跑题。"}]}},{"id":"lq4","skill":"L2-06","ask":{"en":"Which linking words tell the PURPOSE (why)?","zh":"哪个连接词表示目的？"},"why":{"en":"\"in order to\" tells the purpose.","zh":"\"in order to\" 表示目的。"},"teacher":{"ccss":["W.4.1.c"],"origin":"authored","source_doc":false,"v2_interaction":"IT-01 mc","evidence":"mastery"},"type":"pick","lines":["for instance","in order to","also"],"answers":[1],"multi":false,"inline":false,"coach":{"options":[{"en":"“For instance” brings an example, not a purpose.","zh":"“for instance” 引出例子，不是目的。"},{"en":"“In order to” tells the purpose: why.","zh":"“in order to” 说明目的。"},{"en":"“Also” adds one more thing. It doesn’t tell why.","zh":"“also” 是再加一件事。"}]}},{"id":"lq5","skill":"L2-06","ask":{"en":"Which sentence uses a linking word correctly?","zh":"哪句话正确使用了连接词？"},"why":{"en":"The comma goes right after \"For example.\"","zh":"逗号紧跟在 \"For example\" 后面。"},"teacher":{"ccss":["W.4.1.c"],"origin":"authored","source_doc":false,"v2_interaction":"IT-01 mc","evidence":"mastery"},"type":"pick","lines":["For example we, can play soccer.","For example, we can play soccer.","For, example we can play soccer."],"answers":[1],"multi":false,"inline":false,"coach":{"options":[{"en":"The comma is in the wrong place. It goes right after “For example.”","zh":"逗号位置错了，应该紧跟 “For example”。"},{"en":"Yes. The comma comes right after “For example.”","zh":"对，逗号紧跟 “For example”。"},{"en":"The comma splits “For” and “example”. They belong together.","zh":"逗号把 For 和 example 分开了。"}]}},{"id":"rq1","skill":"L2-01","ask":{"en":"Which one is a run-on?","zh":"哪一句是连写句？"},"why":{"en":"Only a comma joins two sentences.","zh":"只用逗号连接了两个句子。"},"teacher":{"ccss":["L.4.1.f","L.4.2.c"],"origin":"authored","source_doc":false,"v2_interaction":"IT-01 mc","evidence":"mastery"},"type":"pick","lines":["The bus was late, so we walked.","The bus was late, we walked.","The bus was late. We walked."],"answers":[1],"multi":false,"inline":false,"coach":{"options":[{"en":"“, so” joins the two sentences correctly.","zh":"“, so” 连接正确。"},{"en":"Only a comma between two whole sentences. That is a run-on.","zh":"两个完整句子之间只有逗号，是连写句。"},{"en":"A period splits them. Two clear sentences.","zh":"句号分开了，是两个清楚的句子。"}]}},{"id":"rq4","skill":"L2-01","ask":{"en":"Which sentence uses the comma correctly?","zh":"哪句逗号用得正确？"},"why":{"en":"Put a comma before \"but\" when it joins two sentences.","zh":"用 but 连接两个句子时前面加逗号。"},"teacher":{"ccss":["L.4.1.f","L.4.2.c"],"origin":"authored","source_doc":false,"v2_interaction":"IT-01 mc","evidence":"mastery"},"type":"pick","lines":["I wanted to swim but the pool was closed.","I wanted to swim, but the pool was closed.","I wanted, to swim but the pool was closed."],"answers":[1],"multi":false,"inline":false,"coach":{"options":[{"en":"This needs a comma before “but”.","zh":"这里 but 前要有逗号。"},{"en":"Yes. Comma before “but” when it joins two sentences.","zh":"对，but 连接两个句子时前面加逗号。"},{"en":"The comma breaks up “wanted to swim”. It doesn’t belong there.","zh":"逗号把 wanted to swim 拆开了。"}]}},{"id":"rq5","skill":"L2-01","ask":{"en":"\"Mia loves art, she paints every day.\" Best fix?","zh":"\"Mia loves art, she paints every day.\" 最好的改法？"},"why":{"en":"A period splits the two sentences.","zh":"用句号把两个句子分开。"},"teacher":{"ccss":["L.4.1.f","L.4.2.c"],"origin":"authored","source_doc":false,"v2_interaction":"IT-01 mc","evidence":"mastery"},"type":"pick","lines":["Mia loves art, she, paints every day.","Mia loves art she paints every day.","Mia loves art. She paints every day."],"answers":[2],"multi":false,"inline":false,"coach":{"options":[{"en":"Adding another comma makes it worse. It is still a run-on.","zh":"再加逗号更糟，还是连写句。"},{"en":"Taking the comma away leaves two sentences squashed together.","zh":"去掉逗号，两个句子挤在一起。"},{"en":"A period and a capital “She”. Two clear sentences.","zh":"句号加大写 She，两个清楚的句子。"}]}},{"id":"tq3","skill":"L2-04","ask":{"en":"Tap the opinion word.","zh":"点出观点词。"},"why":{"en":"\"should\" tells the writer's opinion.","zh":"\"should\" 表示作者的观点。"},"teacher":{"ccss":["W.4.1.a"],"origin":"authored","source_doc":false,"v2_interaction":"IT-02 tapword","evidence":"mastery"},"type":"tapword","text":"Our town should build a bigger library.","targets":[{"at":"should"}],"need":"one","coach":{"words":{"our":{"en":"“Our” tells whose town it is.","zh":"“Our” 说明是谁的城镇。"},"town":{"en":"“Town” is part of the topic.","zh":"“town” 是话题。"},"build":{"en":"“Build” is the action. The opinion word comes before it.","zh":"“build” 是动作，观点词在它前面。"},"a":{"en":"“A” is a tiny helper word.","zh":"“a” 是小词。"},"bigger":{"en":"“Bigger” describes the library. It isn’t the opinion signal.","zh":"“bigger” 形容图书馆，不是观点信号。"},"library":{"en":"“Library” is the topic.","zh":"“library” 是话题。"}}}},{"id":"sq2","skill":"L2-05","ask":{"en":"Tap the off-topic sentence.","zh":"点出离题的句子。"},"why":{"en":"A red bike has nothing to do with school start time.","zh":"红色自行车和上学时间无关。"},"teacher":{"ccss":["W.4.1.b","W.4.1.d"],"origin":"authored","source_doc":false,"v2_interaction":"IT-06 highlight","evidence":"mastery"},"type":"pick","lines":["School should start later.","First, kids need more sleep.","My bike is red.","In addition, kids learn better when they are awake.","For these reasons, school should start at 9:00."],"answers":[2],"multi":false,"inline":true,"coach":{"options":[{"en":"This is the topic sentence.","zh":"这是主题句。"},{"en":"This is a reason about sleep. It is on topic.","zh":"这是关于睡眠的理由。"},{"en":"A red bike has nothing to do with school start time. Off topic.","zh":"红色自行车和上学时间无关，跑题。"},{"en":"This is a second reason. It is on topic.","zh":"这是第二个理由。"},{"en":"This is the closing.","zh":"这是结尾句。"}]}},{"id":"sq4","skill":"L2-05","ask":{"en":"Tap every DETAIL (not a reason).","zh":"点出所有“细节”（不是理由）。"},"why":{"en":"Reasons tell why; details show it.","zh":"理由说为什么，细节来展示。"},"teacher":{"ccss":["W.4.1.b","W.4.1.d"],"origin":"authored","source_doc":false,"v2_interaction":"IT-04 sort","evidence":"mastery"},"type":"pick","lines":["Cooking is a useful skill.","For example, I can make eggs for my family on Sunday.","Cooking can be healthy.","Home-made soup has lots of vegetables."],"answers":[1,3],"multi":true,"coach":{"options":[{"en":"This tells why cooking is good. It is a reason, not a detail.","zh":"这说明为什么，是理由。"},{"en":"A real Sunday and real eggs. That shows it, so it is a detail.","zh":"真实的周日和鸡蛋，是细节。"},{"en":"This tells why. It is a reason.","zh":"这是理由。"},{"en":"Lots of vegetables in real soup shows the healthy reason. It is a detail.","zh":"汤里有很多蔬菜，展示了健康这个理由，是细节。"}]}},{"id":"lq1","skill":"L2-06","ask":{"en":"Choose the linking word.","zh":"选择连接词。"},"why":{"en":"It adds a second reason.","zh":"它补充了第二个理由。"},"teacher":{"ccss":["W.4.1.c"],"origin":"authored","source_doc":false,"v2_interaction":"IT-08 fill","evidence":"mastery"},"type":"pick","context":"Recess helps kids relax. ___ it gives them time to make friends.","lines":["In addition,","For instance,","Because"],"answers":[0],"coach":{"options":[{"en":"“In addition,” brings a second reason. It fits.","zh":"“In addition,” 引出第二个理由。"},{"en":"“For instance,” would bring an example, but this sentence is a new reason.","zh":"“For instance,” 引出例子，但这句是新理由。"},{"en":"“Because” gives a reason inside one sentence. It can’t start this one.","zh":"“Because” 不能这样开头。"}]}},{"id":"lq2","skill":"L2-06","ask":{"en":"Choose the linking word.","zh":"选择连接词。"},"why":{"en":"Strawberries are an example.","zh":"草莓是一个例子。"},"teacher":{"ccss":["W.4.1.c"],"origin":"authored","source_doc":false,"v2_interaction":"IT-08 fill","evidence":"mastery"},"type":"pick","context":"Some fruits are easy to grow. ___ strawberries grow well in small pots.","lines":["For instance,","In addition,","In order to"],"answers":[0],"coach":{"options":[{"en":"Strawberries are an example, so “For instance,” fits.","zh":"草莓是例子，用 “For instance,”。"},{"en":"“In addition,” would mean a new reason, but strawberries are an example.","zh":"“In addition,” 表示新理由，但草莓是例子。"},{"en":"“In order to” tells a purpose. It doesn’t fit here.","zh":"“In order to” 表示目的，这里不合适。"}]}},{"id":"lq3","skill":"L2-06","ask":{"en":"One mark is missing. Fix it right here.","zh":"少了一个标点，直接在这里改。"},"why":{"en":"Comma after \"In addition\" at the start.","zh":"句首 \"In addition\" 后加逗号。"},"teacher":{"ccss":["W.4.1.c"],"origin":"authored","source_doc":false,"v2_interaction":"IT-03 tapfix","evidence":"mastery"},"type":"edit","text":"In addition pets keep us company.","accept":["In addition, pets keep us company."],"coach":{"diagnose":["unchanged","comma_after_link"]}},{"id":"rq2","skill":"L2-01","ask":{"en":"Fix this run-on right here.","zh":"直接在这里改这个连写句。"},"why":{"en":"Comma + so joins the two sentences.","zh":"逗号 + so 连接两个句子。"},"teacher":{"ccss":["L.4.1.f","L.4.2.c"],"origin":"authored","source_doc":false,"v2_interaction":"IT-03 tapfix","evidence":"mastery"},"type":"edit","text":"I finished my homework early, I played chess with my grandpa.","rules":{"noRunOn":true,"mustInclude":[{"re":"homework","msg":"Keep both ideas.","zh":"两个意思都要保留。"},{"re":"chess","msg":"Keep both ideas.","zh":"两个意思都要保留。"}],"capital":true,"endPunct":true},"coach":{"diagnose":["unchanged","run_on","capital","end_punct"]}},{"id":"rq3","skill":"L2-01","ask":{"en":"Tap every run-on.","zh":"点出所有连写句。"},"why":{"en":"Run-ons glue two sentences without a joining word.","zh":"连写句没有用连接词就把两个句子粘在一起。"},"teacher":{"ccss":["L.4.1.f","L.4.2.c"],"origin":"authored","source_doc":false,"v2_interaction":"IT-04 sort","evidence":"mastery"},"type":"pick","lines":["We cleaned the classroom, and it looked great.","The music started everyone danced.","I was hungry, I ate an apple.","I was hungry because I skipped breakfast."],"answers":[1,2],"multi":true,"coach":{"options":[{"en":"“, and” joins these correctly. Not a run-on.","zh":"“, and” 连接正确。"},{"en":"“The music started” and “everyone danced” have nothing between them. Run-on.","zh":"两个句子中间什么都没有，是连写句。"},{"en":"Only a comma holds two sentences. Run-on.","zh":"只有逗号连着两个句子，是连写句。"},{"en":"“Because” joins them correctly. Not a run-on.","zh":"“because” 连接正确。"}]}},{"id":"L2-04.mw","skill":"L2-04","ask":{"en":"Write a topic sentence for this question: \"Should kids have a pet at home?\" Tell your opinion.","zh":"为这个问题写一个主题句：\"孩子应该在家养宠物吗？\" 说出你的观点。"},"why":{"en":"A topic sentence names the topic (a pet at home) and gives your opinion (think / should).","zh":"主题句要说出话题（在家养宠物）和观点（think / should）。"},"ok":{"en":"Yes. It answers the question and tells me what you think.","zh":"对！你的主题句回答了题目，也说出了观点。"},"teacher":{"ccss":["W.4.1.a"],"origin":"authored_v2","source_doc":false,"v2_interaction":null,"evidence":"mastery_writing"},"type":"write","cells":[],"rules":{"mustInclude":[{"re":"\\b(think|believe|should|best|opinion|feel)\\b","msg":"Tell your opinion: use think, believe, or should.","zh":"说出你的观点：用 think、believe 或 should。"},{"re":"\\bpets?\\b","msg":"Answer the question: write about having a pet.","zh":"要回答题目：写关于养宠物的内容。"}],"minWords":5,"capital":true,"endPunct":true},"coach":{"diagnose":["no_opinion","off_topic","capital","end_punct"]}},{"id":"L2-05.mw","skill":"L2-05","ask":{"en":"Reason: \"Recess helps kids make friends.\" Write ONE detail sentence that shows it.","zh":"理由：\"课间能帮助孩子交朋友。\" 写一句能展示它的细节。"},"why":{"en":"A detail shows the reason with something you could see: who, what, where.","zh":"细节要用看得见的事来展示理由：谁、做什么、在哪里。"},"ok":{"en":"Yes. I can see how recess helps kids make friends.","zh":"很好的细节！它展示了课间怎样帮助孩子交朋友。"},"teacher":{"ccss":["W.4.1.b","W.4.1.d"],"origin":"authored_v2","source_doc":false,"v2_interaction":null,"evidence":"mastery_writing"},"type":"write","cells":[],"rules":{"minWords":6,"notVague":true,"stripRe":"^(for example|for instance),?\\s*","vagueMsg":"Show me. What do kids do together at recess?","vagueZh":"展示出来！课间孩子们一起做什么？","mustInclude":[{"re":"\\b(friends?|play|plays|played|game|games|together|talk|team|share|meet|met|join|swings?|ball|tag|laugh|kids|classmates?)\\b","msg":"Keep your detail about recess and making friends.","zh":"细节要和课间交朋友有关。"}],"capital":true,"endPunct":true},"coach":{"diagnose":["too_short","capital","end_punct"]}},{"id":"L2-06.mw","skill":"L2-06","ask":{"en":"Join these two with a linking word that gives an example. Change them right here.","zh":"用一个表示举例的连接词把两句连起来，直接在这里改。"},"why":{"en":"Try: Reading at night helps me. For instance, I learn new words.","zh":"例如：Reading at night helps me. For instance, I learn new words."},"ok":{"en":"Yes. “For instance,” tells me an example is coming.","zh":"正确！\"For instance,\" 表示接下来是一个例子。"},"teacher":{"ccss":["W.4.1.c"],"origin":"authored_v2","source_doc":true,"v2_interaction":null,"evidence":"mastery_writing"},"type":"edit","text":"Reading at night helps me. I learn new words.","rules":{"mustInclude":[{"re":"\\bfor (instance|example)\\b","msg":"This sentence gives an example. Which linking word shows an example?","zh":"这句话是在举例。哪个连接词表示举例？"},{"re":"read","msg":"Keep both ideas: reading at night helps you.","zh":"保留两个意思：晚上读书对你有帮助。"},{"re":"word","msg":"Keep both ideas: you learn new words.","zh":"保留两个意思：你学到新单词。"}],"mustNotMatch":[{"re":"(^|[.!?]\\s+)for (instance|example)\\s+[a-z]","msg":"Put a comma after the linking words when they start a sentence.","zh":"连接词放在句首时后面要加逗号。"}],"capital":true,"endPunct":true},"coach":{"diagnose":["unchanged","missing_link","comma_after_link"]}},{"id":"L2-01.mw","skill":"L2-01","ask":{"en":"Fix this run-on any way you like.","zh":"用你喜欢的方法改正这个连写句。"},"why":{"en":"For example: \"The bell rang, so we ran outside.\" or \"The bell rang. We ran outside.\"","zh":"例如：\"The bell rang, so we ran outside.\" 或 \"The bell rang. We ran outside.\""},"ok":{"en":"Fixed. Two ideas, joined the right way.","zh":"改好了！两个完整的意思连接正确。"},"teacher":{"ccss":["L.4.1.f","L.4.2.c"],"origin":"authored_v2","source_doc":false,"v2_interaction":null,"evidence":"mastery_writing"},"type":"edit","text":"The bell rang, we ran outside.","rules":{"mustInclude":[{"re":"bell","msg":"Keep both ideas: the bell rang.","zh":"保留两个意思：铃响了。"},{"re":"outside","msg":"Keep both ideas: we ran outside.","zh":"保留两个意思：我们跑出去了。"},{"re":"(rang[.!]\\s+[A-Z]|,\\s*(and|so|but)\\b|\\bbecause\\b|\\bwhen\\b|\\bafter\\b)","msg":"Join with a period, a comma + and/so, or because/when.","zh":"用句号、逗号 + and/so，或 because/when 来连接。"}],"capital":true,"endPunct":true,"noRunOn":true},"coach":{"diagnose":["unchanged","run_on","capital","end_punct"]}},{"id":"mt.top","skill":"G2-O","type":"pick","in_model":true,"lines":["I think kids should not have homework on weekends.","First, kids need time to rest.","For instance, my brother is so tired on Friday that he falls asleep at dinner.","In addition, weekends are for family.","My family visits my grandma every Sunday, and we cook dumplings together.","Homework would take that time away.","For these reasons, weekends should be homework-free."],"answers":[0],"multi":false,"any":false,"ask":{"en":"In Paragraph A, tap the sentence that tells the opinion.","zh":"在 A 段中点出说出观点的句子。"},"why":{"en":"Look for “I think” or “should”.","zh":"找 “I think” 或 “should”。"},"teacher":{"ccss":["W.4.1.a","W.4.1.b","W.4.1.d"],"origin":"authored_v3 (replaces v2 m3 label task)","source_doc":true,"evidence":"practice"},"coach":{"hints":[{"en":"Look for the writer’s opinion.","zh":"找作者的观点。"},{"en":"Look for “I think” or “should”. It is near the top.","zh":"找 “I think” 或 “should”，在开头附近。"}],"options":[{"en":"“I think” plus “should not”: this tells the opinion. It is the top bun.","zh":"“I think” 加 “should not” 说出观点，是上层面包。"},{"en":"“First,” starts a reason. It explains the opinion, but it isn’t the opinion.","zh":"“First,” 开始一个理由，不是观点本身。"},{"en":"This is an example about the brother. It shows a reason.","zh":"这是关于哥哥的例子，展示理由。"},{"en":"“In addition,” brings the second reason.","zh":"“In addition,” 引出第二个理由。"},{"en":"This is an example of family time.","zh":"这是家庭时间的例子。"},{"en":"This explains the second reason. It isn’t the opinion.","zh":"这句解释第二个理由，不是观点。"},{"en":"This says the opinion again at the end. That is the closing, not the topic sentence.","zh":"这是在结尾再说观点，是结尾句。"}]}},{"id":"mt.detail","skill":"G2-O","type":"pick","in_model":true,"lines":["I think kids should not have homework on weekends.","First, kids need time to rest.","For instance, my brother is so tired on Friday that he falls asleep at dinner.","In addition, weekends are for family.","My family visits my grandma every Sunday, and we cook dumplings together.","Homework would take that time away.","For these reasons, weekends should be homework-free."],"answers":[2,4],"multi":false,"any":true,"ask":{"en":"Now tap a sentence that gives an example.","zh":"再点一个举例的句子。"},"why":{"en":"An example shows me something that really happened.","zh":"例子会让我看到真实发生的事。"},"teacher":{"ccss":["W.4.1.a","W.4.1.b","W.4.1.d"],"origin":"authored_v3 (replaces v2 m3 label task)","source_doc":true,"evidence":"practice"},"coach":{"hints":[{"en":"An example tells about a real person or a real day.","zh":"例子讲的是真实的人或真实的一天。"},{"en":"There are two. One is about a brother, one is about Sunday.","zh":"有两句，一句关于哥哥，一句关于星期天。"}],"options":[{"en":"This is the opinion, not an example.","zh":"这是观点，不是例子。"},{"en":"This is a reason. It tells why, but it doesn’t show it.","zh":"这是理由，说了为什么但没展示。"},{"en":"“For instance,” and a real brother who falls asleep at dinner. That is an example.","zh":"“For instance,” 加上真实的哥哥，是例子。"},{"en":"This is the second reason. It tells, it doesn’t show.","zh":"这是第二个理由，只是告诉。"},{"en":"A real family, a real grandma, real dumplings. That shows it.","zh":"真实的家人、奶奶、饺子，这是展示。"},{"en":"This explains the reason, but it isn’t something that happened.","zh":"这句解释理由，但不是发生过的事。"},{"en":"This is the closing.","zh":"这是结尾句。"}]}},{"id":"mt.bottom","skill":"G2-O","type":"pick","in_model":true,"lines":["I think kids should not have homework on weekends.","First, kids need time to rest.","For instance, my brother is so tired on Friday that he falls asleep at dinner.","In addition, weekends are for family.","My family visits my grandma every Sunday, and we cook dumplings together.","Homework would take that time away.","For these reasons, weekends should be homework-free."],"answers":[6],"multi":false,"any":false,"ask":{"en":"Tap the closing sentence.","zh":"点出结尾句。"},"why":{"en":"The closing is the last sentence. It says the opinion again.","zh":"结尾句是最后一句，再说一次观点。"},"teacher":{"ccss":["W.4.1.a","W.4.1.b","W.4.1.d"],"origin":"authored_v3 (replaces v2 m3 label task)","source_doc":true,"evidence":"practice"},"coach":{"hints":[{"en":"The closing is at the very end.","zh":"结尾句在最后。"},{"en":"Look for “For these reasons,”.","zh":"找 “For these reasons,”。"}],"options":[{"en":"This is the first sentence, the topic sentence. The closing comes at the end.","zh":"这是第一句主题句，结尾句在最后。"},{"en":"This is a reason.","zh":"这是理由。"},{"en":"This is an example.","zh":"这是例子。"},{"en":"This brings the second reason.","zh":"这是第二个理由。"},{"en":"This is an example.","zh":"这是例子。"},{"en":"This explains a reason. The paragraph isn’t finished yet.","zh":"这句解释理由，段落还没结束。"},{"en":"“For these reasons,” plus the opinion again. That wraps it up.","zh":"“For these reasons,” 加上再次说观点，收尾了。"}]}},{"id":"m1","skill":"G2-O","ask":{"en":"Which paragraph is stronger? Tap it.","zh":"哪一段写得更好？点它。"},"why":{"en":"Paragraph A has an opinion, two reasons with examples, and a closing.","zh":"A 段有观点、两个带例子的理由，还有结尾。"},"teacher":{"ccss":["W.4.1"],"origin":"authored","source_doc":true,"v2_interaction":"IT-21 mc","evidence":"practice"},"type":"pick","lines":["Paragraph A","Paragraph B"],"answers":[0],"multi":false,"inline":false,"coach":{"hints":[{"en":"Check each paragraph for every layer of the hamburger.","zh":"检查每段是不是汉堡的每层都有。"},{"en":"Which one has an example after each reason?","zh":"哪一段每个理由后面都有例子？"}],"options":[{"en":"Paragraph A has the opinion, two reasons each with an example, and a closing. Every layer is there.","zh":"A 段有观点、两个各带例子的理由和结尾，每层都有。"},{"en":"Paragraph B gives reasons but doesn’t show them. The middle of the burger is thin.","zh":"B 段有理由但没展示，汉堡中间太薄。"}]}},{"id":"m2","skill":"G2-O","ask":{"en":"Why is it stronger? Tap two.","zh":"为什么更好？点两个。"},"why":{"en":"It isn’t about length or big words. Look at the topic sentence and the details.","zh":"不是因为长或用了难词，看看主题句和细节。"},"teacher":{"ccss":["W.4.1"],"origin":"authored","source_doc":true,"v2_interaction":"IT-21 multi","evidence":"practice"},"type":"pick","lines":["It has a topic sentence that tells the opinion.","It is longer.","Each reason has a detail.","It uses big words."],"answers":[0,2],"multi":true,"inline":false,"coach":{"hints":[{"en":"Think about the layers, not the size.","zh":"想想层次，不是长短。"},{"en":"One answer is about the top bun. One is about the middle.","zh":"一个答案关于上层面包，一个关于中间。"}],"options":[{"en":"Yes. A clear topic sentence tells the reader what the writer thinks.","zh":"对，清楚的主题句告诉读者作者的想法。"},{"en":"Longer isn’t better. A long paragraph can still be missing layers.","zh":"长不等于好，长段落也可能缺层。"},{"en":"Yes. Each reason is shown with a real example.","zh":"对，每个理由都有真实的例子。"},{"en":"Big words don’t make it stronger. Clear layers do.","zh":"大词不会让它更好，清楚的层次才会。"}]}}],"lexicon":{"cups":[["C","Capitals","Every sentence starts with a capital. \"I\" is a capital.","大写：句首大写，I 永远大写。"],["U","Usage","My sentences make sense. No run-ons.","用法：句子通顺，没有连写句。"],["P","Punctuation","Every sentence has an end mark. Comma after linking words.","标点：每句有句末标点，连接词后有逗号。"],["S","Spelling","I checked my spelling.","拼写：检查过拼写。"]],"linking":[["First,","首先"],["For example,","例如"],["For instance,","比如"],["In addition,","此外"],["Also,","而且"],["Another reason is","另一个理由是"],["because","因为"],["in order to","为了"],["For these reasons,","基于这些理由"]]},"report_levels":[{"en":"Not yet","zh":"还没有"},{"en":"Getting there","zh":"快到了"},{"en":"Got it","zh":"做到了"},{"en":"Wow","zh":"太棒了"}],"unit_goals":[{"en":"write a topic sentence that tells what you think","zh":"写一个说出你想法的主题句"},{"en":"give two reasons, each with an example, and a closing","zh":"给出两个理由，每个都有例子，再写结尾"},{"en":"help your reader follow you with linking words","zh":"用连接词帮读者跟上你"},{"en":"fix run-on sentences","zh":"改正连写句"},{"en":"plan, write and revise your own paragraph","zh":"计划、写作并修改你自己的段落"}],"coach":{"diagnostics":{"unchanged":{"en":"It still looks the same as before. What needs to change?","zh":"看起来还和原来一样。哪里需要改？"},"blank":{"en":"There is still a ___ to fill.","zh":"还有一个 ___ 没填。"},"run_on":{"en":"I still see two sentences joined by only a comma. Use a period, or a comma with and or so.","zh":"我还看到两个句子只用逗号连着。用句号，或逗号加 and / so。"},"capital":{"en":"A sentence needs a capital letter at the start.","zh":"句子开头要大写。"},"end_punct":{"en":"Every sentence needs an end mark, like a period.","zh":"每个句子结尾都要有标点，比如句号。"},"comma_after_link":{"en":"A linking word at the start needs a comma right after it.","zh":"句首的连接词后面要加逗号。"},"missing_link":{"en":"The linking words are missing. Which signpost did the task ask for?","zh"
