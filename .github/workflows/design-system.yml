name: Design System Review Gates
on:
  pull_request:
    paths:
      - 'apps/writing/**'
      - 'packages/design-system/**'
      - 'scripts/**'
      - 'DESIGN.md'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/design-system.yml'
  workflow_dispatch:
jobs:
  verification:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run check:docs
      - run: npm run check:reuse
      - run: npm run check:tokens
      - run: npm run check:motion
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
