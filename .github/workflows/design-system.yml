name: Design System Review Gates
on:
  pull_request:
    paths:
      - 'apps/writing/**'
      - 'packages/design-system/**'
      - 'scripts/**'
      - 'DESIGN.md'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/design-system.yml'
  workflow_dispatch:
jobs:
  verification:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run check:docs
      - run: npm run check:reuse
      - run: npm run check:tokens
      - run: npm run check:motion
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:layout -w @big-academy/writing -- writing-hifi-r2.spec.ts
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: writing-r2-browser-evidence
          path: |
            apps/writing/docs/evidence/r2-review/
            apps/writing/test-results/
          if-no-files-found: ignore

  independent-clean-checkout:
    # Independent reproducible validation, not two separately authored AI implementations.
    needs: verification
    strategy:
      fail-fast: false
      matrix:
        pass: [validation-a, validation-b]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npx playwright install --with-deps chromium
      - run: npm run test:layout -w @big-academy/writing -- writing-hifi-r2.spec.ts
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: writing-${{ matrix.pass }}-evidence
          path: |
            apps/writing/docs/evidence/r2-review/
            apps/writing/test-results/
          if-no-files-found: ignore
