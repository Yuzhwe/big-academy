name: Writing baseline regression (Review 05/06/Docs/Main)
on:
  push:
    branches:
      - feat/writing-review05-components-pages
      - feat/writing-review06-refinement
      - audit/writing-review06-documentation-sync-20261028
      - chore/writing-baseline01-integration
      - main
  workflow_dispatch:
concurrency:
  group: review05-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Git whitespace safety relative to main
        run: git diff --check "$(git merge-base origin/main HEAD)" HEAD
      - run: npm ci
      - run: npm run check:docs
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: google-chrome --version
      - run: npx playwright install ffmpeg
      - run: npm run test:integration
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: review05-browser-evidence
          path: |
            apps/writing/docs/evidence/
            apps/writing/test-results/
          retention-days: 14
