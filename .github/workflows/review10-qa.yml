name: Writing Review 07 · Refinement 10 QA
on:
  push:
    branches:
      - feat/writing-review07-refinement10
  workflow_dispatch:

concurrency:
  group: writing-r10-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: R10 TypeScript, units, build and browser
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Whitespace check only against stacked PR #63
        run: |
          git fetch origin feat/writing-review07-refinement09
          git diff --check "$(git merge-base origin/feat/writing-review07-refinement09 HEAD)" HEAD
      - run: npm ci
      - run: npm run check:docs
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: google-chrome --version
      - run: npx playwright install ffmpeg
      - name: R10 browser spec (real computed style, geometry, input and scroll)
        run: npx playwright test -c apps/writing/playwright.integration.config.ts apps/writing/e2e/review10.spec.ts
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: writing-review10-browser-evidence
          path: |
            apps/writing/docs/evidence/integration-v1/playwright-results.json
            apps/writing/test-results/
          retention-days: 14
          if-no-files-found: ignore
